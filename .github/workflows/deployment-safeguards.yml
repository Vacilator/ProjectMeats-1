name: "Deployment Safeguards"

# This workflow adds critical safety checks to prevent broken deployments
# from propagating through the pipeline (dev → UAT → production)

on:
  workflow_run:
    workflows: ["Master Pipeline"]
    types: [completed]
    branches: [development, uat]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-deployment:
    name: "Validate Deployment Success"
    runs-on: ubuntu-latest
    steps:
      - name: Check Workflow Conclusion
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          
          echo "Workflow Conclusion: $CONCLUSION"
          echo "Run ID: $RUN_ID"
          echo "Branch: $BRANCH"
          
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "❌ DEPLOYMENT FAILED - Blocking auto-promotion"
            echo "deployment_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if all critical jobs succeeded
          FAILED_JOBS=$(gh run view $RUN_ID --json jobs --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .name')
          
          if [[ -n "$FAILED_JOBS" ]]; then
            echo "❌ Critical jobs failed:"
            echo "$FAILED_JOBS"
            echo "deployment_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if frontend and backend deployed successfully
          DEPLOY_JOBS=$(gh run view $RUN_ID --json jobs --jq '.jobs[] | select(.name | contains("Deploy")) | select(.conclusion != "success") | .name')
          
          if [[ -n "$DEPLOY_JOBS" ]]; then
            echo "❌ Deployment jobs failed:"
            echo "$DEPLOY_JOBS"
            echo "deployment_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ All deployment checks passed"
          echo "deployment_ok=true" >> $GITHUB_OUTPUT
      
      - name: Block Auto-Promotion on Failure
        if: steps.check.outputs.deployment_ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          TARGET=""
          
          if [[ "$BRANCH" == "development" ]]; then
            TARGET="uat"
          elif [[ "$BRANCH" == "uat" ]]; then
            TARGET="main"
          fi
          
          if [[ -n "$TARGET" ]]; then
            # Check if there's an auto-generated release PR
            PR_NUMBER=$(gh pr list --base $TARGET --head $BRANCH --json number --jq '.[0].number')
            
            if [[ -n "$PR_NUMBER" ]]; then
              echo "Found auto-promotion PR #$PR_NUMBER - Closing it"
              gh pr close $PR_NUMBER --comment "🚨 **Auto-promotion blocked** - $BRANCH deployment failed.

**Run**: https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}

Please fix the deployment issues before promoting to $TARGET."
            fi
          fi
          
          echo "⚠️ Deployment validation failed - auto-promotion prevented"
      
      - name: Create Issue on Repeated Failures
        if: steps.check.outputs.deployment_ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          
          # Check for recent failures (last 5 runs)
          RECENT_FAILURES=$(gh run list --workflow="Master Pipeline" --branch $BRANCH --limit 5 --json conclusion --jq '[.[] | select(.conclusion != "success")] | length')
          
          if [[ "$RECENT_FAILURES" -ge 3 ]]; then
            echo "🚨 Multiple consecutive failures detected ($RECENT_FAILURES/5)"
            
            # Check if issue already exists
            EXISTING=$(gh issue list --label "deployment-failure" --label "$BRANCH" --state open --json number --jq '.[0].number')
            
            if [[ -z "$EXISTING" ]]; then
              gh issue create \
                --title "🚨 URGENT: $BRANCH deployment failing repeatedly" \
                --body "## 🚨 Critical Deployment Failure

**Branch**: \`$BRANCH\`
**Failure Count**: $RECENT_FAILURES consecutive failures
**Latest Run**: https://github.com/${{ github.repository }}/actions/runs/$RUN_ID

### Action Required
1. Review failed jobs in latest run
2. Fix root cause
3. Verify with \`npm run build\` / \`python manage.py check\` locally
4. Test deployment on dev environment

### Auto-Promotion Status
⛔ **BLOCKED** - Will not promote to next environment until resolved.

### Common Issues
- Build failures (check package.json, dependencies)
- Migration errors (check Django models)
- Test failures (check test logs)
- Docker build errors (check Dockerfiles)

Close this issue once deployment is stable." \
                --label "deployment-failure" \
                --label "$BRANCH" \
                --label "urgent"
              
              echo "Created issue for repeated failures"
            else
              echo "Issue already exists: #$EXISTING"
            fi
          fi
