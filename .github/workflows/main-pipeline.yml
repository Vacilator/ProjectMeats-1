name: "🚀 Deploy: Dev/UAT/Prod (Frontend + Backend via Golden Pipeline)"

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format(
        '🛠️ Deploy: {0} — manual on {1} ({2}) by {3} (run#{4})',
        github.event.inputs.environment == 'development' && 'Dev'
          || github.event.inputs.environment == 'uat' && 'UAT'
          || github.event.inputs.environment == 'production' && 'Prod'
          || github.event.inputs.environment,
        github.ref_name,
        github.sha,
        github.actor,
        github.run_number
      )
      || (
        !contains(github.event.head_commit.message, 'Co-authored-by:')
          && format(
            '🚀 Deploy: {0} — {1} (run#{2})',
            github.ref_name == 'development' && 'Dev'
              || github.ref_name == 'uat' && 'UAT'
              || github.ref_name == 'main' && 'Prod'
              || github.ref_name,
            github.event.head_commit.message,
            github.run_number
          )
          || format(
            '🚀 Deploy: {0} — {1} ({2}) (run#{3})',
            github.ref_name == 'development' && 'Dev'
              || github.ref_name == 'uat' && 'UAT'
              || github.ref_name == 'main' && 'Prod'
              || github.ref_name,
            github.ref_name,
            github.sha,
            github.run_number
          )
      )
  }}


on:
  push:
    branches: [development, uat, main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'archived/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - uat
          - production
      deploy_by_digest:
        description: 'Optional: after pulling immutable env-SHA tag, run docker containers by resolved digest'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # NEVER cancel in-progress deployments - only skip queued ones via check-latest

jobs:
  check_infrastructure:
    name: "Check Infrastructure (Golden Drift Gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Cache pip (infra)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-infra-${{ hashFiles('.github/scripts/check_infrastructure.sh', '.github/scripts/validate-workflows.sh') }}
          restore-keys: |
            ${{ runner.os }}-pip-infra-

      - name: Run infrastructure checks
        run: bash .github/scripts/check_infrastructure.sh

  # ==========================================
  # Detect Latest Commit (Smart Queue Management)
  # ==========================================
  # This job prevents deploying stale commits when multiple commits are pushed rapidly.
  # 
  # Behavior:
  # - If deployment is IN-PROGRESS: Let it finish (cancel-in-progress: false protects it)
  # - If deployment is QUEUED: Check if it's the latest commit
  #   - If YES: Proceed with deployment
  #   - If NO: Skip gracefully (commits are included in next deployment via git history)
  # 
  # This ensures:
  # 1. Running deployments are NEVER cancelled (prevents half-deployed state)
  # 2. Queued deployments for old commits are skipped (saves CI time)
  # 3. All commits are eventually deployed (git history is cumulative)
  check-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check_infrastructure]
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      latest_sha: ${{ steps.check.outputs.latest_sha }}
      trigger_sha: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 10  # Get recent commits to check for newer ones
      
      - name: Check if this is the latest commit
        id: check
        run: |
          TRIGGER_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          
          # Get latest commit on branch
          LATEST_SHA=$(git rev-parse "origin/$BRANCH")
          
          echo "Trigger SHA: $TRIGGER_SHA"
          echo "Latest SHA:  $LATEST_SHA"
          
          if [ "$TRIGGER_SHA" = "$LATEST_SHA" ]; then
            echo "✅ This is the latest commit - proceeding with deployment"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "⏭️  Newer commit exists ($LATEST_SHA) - skipping this deployment"
            echo "This commit will be included in the next deployment"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi
          
          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"

  # ==========================================
  # Route to Development
  # ==========================================
  deploy-dev:
    if: |
      needs.check-latest.outputs.should_deploy == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/development') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development'))
    needs: [check-latest]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: inherit  # Environment context set in reusable workflow jobs
    with:
      environment: 'development'
      ref: ${{ github.ref }}
      image_tag: 'development-${{ github.sha }}'
      backend_environment: 'dev-backend'
      frontend_environment: 'dev-frontend'
      api_base_url: 'https://dev.meatscentral.com'
      deploy_by_digest: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_by_digest == 'true' || github.event.inputs.deploy_by_digest == true) || false }}

  # ==========================================
  # Route to UAT
  # ==========================================
  deploy-uat:
    if: |
      needs.check-latest.outputs.should_deploy == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/uat') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'uat'))
    needs: [check-latest]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: inherit  # Environment context set in reusable workflow jobs
    with:
      environment: 'uat'
      ref: ${{ github.ref }}
      image_tag: 'uat-${{ github.sha }}'
      backend_environment: 'uat-backend'
      frontend_environment: 'uat-frontend'
      api_base_url: 'https://uat.meatscentral.com'
      deploy_by_digest: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_by_digest == 'true' || github.event.inputs.deploy_by_digest == true) || false }}

  # ==========================================
  # Route to Production
  # ==========================================
  deploy-prod:
    if: |
      needs.check-latest.outputs.should_deploy == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'))
    needs: [check-latest]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: inherit  # Environment context set in reusable workflow jobs
    with:
      environment: 'production'
      ref: ${{ github.ref }}
      image_tag: 'production-${{ github.sha }}'
      backend_environment: 'production-backend'
      frontend_environment: 'production-frontend'
      api_base_url: 'https://meatscentral.com'
      deploy_by_digest: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_by_digest == 'true' || github.event.inputs.deploy_by_digest == true) || false }}

