name: AI PR Gatekeeper

on:
  pull_request_target:
    branches: [development, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-gatekeeper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-pr-gatekeeper:
    name: AI PR Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-backend

    steps:
      - name: Checkout base repository rules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install AI reviewer deps
        run: python -m pip install "openai>=2.32.0,<3"

      - name: Review diff against Golden Rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
          AI_PR_REVIEW_MODEL: gpt-4o-mini
        run: python scripts/ci/ai_pr_guard.py
