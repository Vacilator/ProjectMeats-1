name: "🔧 Ops: Database Surgery & Maintenance"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      type:
        description: "Operation type"
        required: true
        type: choice
        options:
          - sql
          - shell
      script:
        description: "SQL query or shell script to execute"
        required: true
        type: string

concurrency:
  group: ops-surgery-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  check_infrastructure:
    name: "Check Infrastructure (Golden Drift Gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Run infrastructure checks
        run: bash .github/scripts/check_infrastructure.sh

  execute:
    name: "${{ inputs.type }} on ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    needs: [check_infrastructure]
    environment: ${{ inputs.environment == 'prod' && 'production-backend' || format('{0}-backend', inputs.environment) }}
    timeout-minutes: 10
    
    steps:
      - name: Setup SSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
      
      - name: Set Environment Context
        id: context
        run: |
          {
            # Canonical environment-scoped secrets (manifests/env.manifest.json)
            echo "HOST=${{ secrets.SSH_HOST }}"
            echo "USER=${{ secrets.SSH_USER }}"

            # Prefer password auth if SSH_KEY is not provided.
            echo "PASS=${{ secrets.SSH_PASSWORD }}"
          } >> "$GITHUB_OUTPUT"
      
      - name: Execute SQL Surgery
        if: inputs.type == 'sql'
        env:
          SSHPASS: ${{ steps.context.outputs.PASS }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SQL_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          HOST="${{ steps.context.outputs.HOST }}"
          USER="${{ steps.context.outputs.USER }}"

          echo "🔧 SQL Surgery Operation"
          echo "📍 Target: $USER@$HOST"
          echo "🌍 Environment: ${{ inputs.environment }}"
          echo "📝 Query: $SQL_SCRIPT"

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          if [ -n "${SSH_KEY:-}" ]; then
            KEY_FILE="$HOME/.ssh/ops_key"
            printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            SSH_CMD="ssh -i $KEY_FILE -o IdentitiesOnly=yes $SSH_OPTS"
            SCP_CMD="scp -i $KEY_FILE -o IdentitiesOnly=yes $SSH_OPTS"
          else
            if [ -z "${SSHPASS:-}" ]; then
              echo "::error::No SSH auth available (set SSH_PASSWORD or SSH_KEY in the environment secrets)."
              exit 1
            fi
            SSH_CMD="sshpass -e ssh $SSH_OPTS"
            SCP_CMD="sshpass -e scp $SSH_OPTS"
          fi

          # Create temporary SQL file
          echo "$SQL_SCRIPT" > surgery.sql

          # Transfer SQL file to server
          $SCP_CMD surgery.sql $USER@$HOST:/tmp/surgery.sql

          # Execute SQL using psql with credentials from .env
          $SSH_CMD $USER@$HOST << 'ENDSSH'
          set -euo pipefail
          
          # Load database credentials from backend .env (Robust parser)
          # Handles quoted values, comments, and malformed lines
          while IFS='=' read -r key value; do
            # Skip empty lines and comments
            [[ -z "$key" || "$key" =~ ^#.*$ ]] && continue
            # Remove quotes from value if present
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            export "$key=$value"
          done < <(grep -v '^#' /root/projectmeats/backend/.env | grep '=' || true)
          
          # Execute SQL with PGPASSWORD
          export PGPASSWORD="$DB_PASSWORD"
          
          echo "🔍 Executing SQL..."
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -f /tmp/surgery.sql
          
          echo "✅ SQL executed successfully"
          
          # Cleanup
          rm -f /tmp/surgery.sql
          ENDSSH
          
          echo "🎉 Surgery complete"
      
      - name: Execute Shell Command
        if: inputs.type == 'shell'
        env:
          SSHPASS: ${{ steps.context.outputs.PASS }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SHELL_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          HOST="${{ steps.context.outputs.HOST }}"
          USER="${{ steps.context.outputs.USER }}"

          echo "🔧 Shell Command Operation"
          echo "📍 Target: $USER@$HOST"
          echo "🌍 Environment: ${{ inputs.environment }}"
          echo "📝 Command: $SHELL_SCRIPT"

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          if [ -n "${SSH_KEY:-}" ]; then
            KEY_FILE="$HOME/.ssh/ops_key"
            printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            SSH_CMD="ssh -i $KEY_FILE -o IdentitiesOnly=yes $SSH_OPTS"
          else
            if [ -z "${SSHPASS:-}" ]; then
              echo "::error::No SSH auth available (set SSH_PASSWORD or SSH_KEY in the environment secrets)."
              exit 1
            fi
            SSH_CMD="sshpass -e ssh $SSH_OPTS"
          fi

          # Execute shell command
          $SSH_CMD $USER@$HOST << ENDSSH
          set -euo pipefail
          
          cd /root/projectmeats
          
          echo "🔍 Executing command..."
          $SHELL_SCRIPT
          
          echo "✅ Command executed successfully"
          ENDSSH
          
          echo "🎉 Operation complete"
