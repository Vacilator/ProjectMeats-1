name: Post-Deploy Smoke Gates (Reusable)

on:
  workflow_call:
    inputs:
      backend_environment:
        required: true
        type: string
      frontend_environment:
        required: true
        type: string
      require_redis_readiness:
        required: false
        type: boolean
        default: false
      run_backend_lane:
        required: false
        type: boolean
        default: true
      run_frontend_lane:
        required: false
        type: boolean
        default: true

jobs:
  smoke-backend-container:
    name: "Smoke: Backend Container"
    if: ${{ inputs.run_backend_lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.backend_environment }}

    steps:
      - name: Setup SSH
        run: |
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y sshpass
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>&1

      - name: Verify backend health (direct-to-container)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'SSH'
          set -euo pipefail

          URL="http://127.0.0.1:8000/api/v1/health/"
          if [ "${{ inputs.require_redis_readiness }}" = "true" ]; then
            URL="http://127.0.0.1:8000/api/v1/ready/"
          fi
          echo "Checking backend: ${URL}"

          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Backend healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Backend health attempt $attempt/5 failed (HTTP $HTTP_CODE), retrying..."
            sleep 3
          done

          echo "✗ Backend health check failed after 5 attempts"
          exit 1
          SSH

  smoke-frontend-container:
    name: "Smoke: Frontend Container"
    if: ${{ inputs.run_frontend_lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.frontend_environment }}

    steps:
      - name: Setup SSH
        run: |
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y sshpass
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>&1

      - name: Verify frontend health (direct-to-container)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'SSH'
          set -euo pipefail

          URL="http://127.0.0.1:8080/"
          echo "Checking frontend: ${URL}"

          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Frontend healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Frontend health attempt $attempt/5 failed (HTTP $HTTP_CODE), retrying..."
            sleep 3
          done

          echo "✗ Frontend health check failed after 5 attempts"
          exit 1
          SSH

  post-deploy-validation:
    name: "Post-Deploy Validation"
    if: ${{ always() }}
    needs: [smoke-backend-container, smoke-frontend-container]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report success
        run: |
          set -euo pipefail

          if [ "${{ inputs.run_backend_lane }}" = "true" ] && [ "${{ needs.smoke-backend-container.result }}" != "success" ]; then
            echo "✗ smoke-backend-container result: ${{ needs.smoke-backend-container.result }}" >&2
            exit 1
          fi

          if [ "${{ inputs.run_frontend_lane }}" = "true" ] && [ "${{ needs.smoke-frontend-container.result }}" != "success" ]; then
            echo "✗ smoke-frontend-container result: ${{ needs.smoke-frontend-container.result }}" >&2
            exit 1
          fi

          echo "✓ Post-deploy smoke gates passed"
