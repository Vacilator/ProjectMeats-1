name: "21 - Security Scan & Dependency Audit"

on:
  pull_request:
    branches: [development, uat, main]
  push:
    branches: [development, uat, main]
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  check_infrastructure:
    name: "Check Infrastructure (Golden Drift Gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run infrastructure checks
        run: bash .github/scripts/check_infrastructure.sh

  python-security:
    name: "Python Security Audit"
    runs-on: ubuntu-latest
    needs: [check_infrastructure]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt
      
      - name: Run Safety (dependency vulnerabilities)
        working-directory: ./backend
        run: |
          echo "Checking for known security vulnerabilities..."
          safety check --json || true
      
      - name: Run Bandit (code security analysis)
        working-directory: ./backend
        run: |
          echo "Running static security analysis..."
          bandit -r apps/ tenant_apps/ -f json -o bandit-report.json || true
          bandit -r apps/ tenant_apps/ -ll || true
      
      - name: Upload Bandit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json
  
  javascript-security:
    name: "JavaScript Security Audit"
    runs-on: ubuntu-latest
    needs: [check_infrastructure]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./frontend
        run: |
          echo "Checking for known vulnerabilities..."
          npm audit --json > npm-audit.json || true
          npm audit || true
      
      - name: Upload npm audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit.json
  
  docker-image-scan:
    name: "Docker Image Security Scan"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: [check_infrastructure]
    
    strategy:
      matrix:
        component: [backend, frontend]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Build Docker image
        run: |
          docker build -t projectmeats-${{ matrix.component }}:scan \
            -f ${{ matrix.component }}/Dockerfile \
            .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: projectmeats-${{ matrix.component }}:scan
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.component }}.sarif'
          category: 'trivy-${{ matrix.component }}'
      
      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: projectmeats-${{ matrix.component }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
  
  secret-scan:
    name: "Secret Detection Scan"
    runs-on: ubuntu-latest
    needs: [check_infrastructure]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for better detection

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.18.4"
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --no-git \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload gitleaks results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
  
  sbom-generation:
    name: "Generate SBOM"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check_infrastructure]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Generate Python SBOM
        working-directory: ./backend
        run: |
          pip install cyclonedx-bom
          cyclonedx-py -r -i requirements.txt -o sbom-python.json
      
      - name: Generate JavaScript SBOM
        working-directory: ./frontend
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom-javascript.json
      
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-reports
          path: |
            backend/sbom-python.json
            frontend/sbom-javascript.json
  
  security-summary:
    name: "Security Scan Summary"
    runs-on: ubuntu-latest
    needs: [python-security, javascript-security]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
      
      - name: Display summary
        run: |
          {
            echo "## Security Scan Summary"
            echo ""
            echo "✅ Python security audit completed"
            echo "✅ JavaScript security audit completed"

            if [ -f bandit-report/bandit-report.json ]; then
              echo "📊 Bandit report available"
            fi

            if [ -f npm-audit-report/npm-audit.json ]; then
              echo "📊 npm audit report available"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
