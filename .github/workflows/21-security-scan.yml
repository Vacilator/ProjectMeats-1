name: "21 - Security Scan & Dependency Audit"

on:
  pull_request:
    branches: [development, uat, main]
  push:
    branches: [development, uat, main]
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-security:
    name: "Python Security Audit"
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt
      
      - name: Run Safety (dependency vulnerabilities)
        working-directory: ./backend
        run: |
          echo "Checking for known security vulnerabilities..."
          safety check --json || true
      
      - name: Run Bandit (code security analysis)
        working-directory: ./backend
        run: |
          echo "Running static security analysis..."
          bandit -r apps/ tenant_apps/ -f json -o bandit-report.json || true
          bandit -r apps/ tenant_apps/ -ll || true
      
      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json
  
  javascript-security:
    name: "JavaScript Security Audit"
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./frontend
        run: |
          echo "Checking for known vulnerabilities..."
          npm audit --json > npm-audit.json || true
          npm audit || true
      
      - name: Upload npm audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit.json
  
  docker-image-scan:
    name: "Docker Image Security Scan"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    
    strategy:
      matrix:
        component: [backend, frontend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build -t projectmeats-${{ matrix.component }}:scan \
            -f ${{ matrix.component }}/Dockerfile \
            .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: projectmeats-${{ matrix.component }}:scan
          format: 'sarif'
          output: 'trivy-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.component }}.sarif'
          category: 'trivy-${{ matrix.component }}'
      
      - name: Run Trivy (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: projectmeats-${{ matrix.component }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
  
  secret-scan:
    name: "Secret Detection Scan"
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  sbom-generation:
    name: "Generate SBOM"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Python SBOM
        working-directory: ./backend
        run: |
          pip install cyclonedx-bom
          cyclonedx-py -r -i requirements.txt -o sbom-python.json
      
      - name: Generate JavaScript SBOM
        working-directory: ./frontend
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom-javascript.json
      
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            backend/sbom-python.json
            frontend/sbom-javascript.json
  
  security-summary:
    name: "Security Scan Summary"
    runs-on: ubuntu-latest
    needs: [python-security, javascript-security]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Display summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Python security audit completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ JavaScript security audit completed" >> $GITHUB_STEP_SUMMARY
          
          if [ -f bandit-report/bandit-report.json ]; then
            echo "📊 Bandit report available" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f npm-audit-report/npm-audit.json ]; then
            echo "📊 npm audit report available" >> $GITHUB_STEP_SUMMARY
          fi
