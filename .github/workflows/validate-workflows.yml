name: Validate Workflow Syntax

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [development, uat, main]
    paths:
      - '.github/workflows/**'

jobs:
  validate-syntax:
    name: "Validate Workflow YAML Syntax"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          # Install actionlint for workflow validation
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/

      - name: Validate workflow files
        run: |
          echo "Validating all workflow files..."
          actionlint -color

      - name: Check for common mistakes
        run: |
          echo "Checking for common workflow mistakes..."
          
          # Check: environment: with uses: (INVALID)
          if grep -r "environment:" .github/workflows/*.yml | grep -A5 "uses:"; then
            echo "❌ ERROR: Found 'environment:' used with 'uses:' (invalid syntax)"
            echo "RULE: Jobs calling reusable workflows CANNOT have environment: set"
            echo "FIX: Remove environment: from caller, set it in reusable workflow jobs"
            exit 1
          fi
          
          # Check: Missing secrets declaration on reusable workflow call
          if grep -r "uses: \.\/\.github\/workflows\/" .github/workflows/main-pipeline.yml | grep -v "secrets:"; then
            echo "⚠️  WARNING: Reusable workflow call without secrets declaration"
            echo "Consider adding 'secrets: inherit' or explicit secret passing"
          fi
          
          echo "✅ No common mistakes found"

      - name: Verify INSTALLED_APPS matches codebase
        if: contains(github.event.pull_request.changed_files, 'backend/projectmeats/settings/base.py')
        run: |
          echo "Checking for archived apps in INSTALLED_APPS..."
          
          # Extract INSTALLED_APPS
          APPS=$(grep -A 100 "_PROJECT_APPS = \[" backend/projectmeats/settings/base.py | grep -E '^\s+"[^"]+",?' | sed 's/[",]//g' | tr -d ' ')
          
          # Check each app exists
          for app in $APPS; do
            app_path=$(echo "$app" | tr '.' '/')
            if [ ! -d "backend/$app_path" ]; then
              echo "❌ ERROR: App '$app' in INSTALLED_APPS but directory 'backend/$app_path' does not exist"
              echo "This app may have been archived. Remove it from INSTALLED_APPS."
              exit 1
            fi
          done
          
          echo "✅ All INSTALLED_APPS reference existing directories"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Workflow Validation Summary"
            echo ""
            echo "- ✅ YAML syntax validation"
            echo "- ✅ Common mistake checks"
            echo "- ✅ INSTALLED_APPS verification"
          } >> $GITHUB_STEP_SUMMARY
