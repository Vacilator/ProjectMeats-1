on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (development, uat, production)"
      ref:
        required: true
        type: string
        description: "Git reference to deploy"
      backend_environment:
        required: false
        type: string
        description: "GitHub Environment name for backend (e.g., dev-backend)"
        default: ""
      frontend_environment:
        required: false
        type: string
        description: "GitHub Environment name for frontend (e.g., dev-frontend)"
        default: ""
      image_tag:
        required: false
        type: string
        description: "Docker image tag (optional, for future Build Once Deploy Many pattern)"
        default: ""
      api_base_url:
        required: false
        type: string
        description: "API base URL for frontend (optional, for future Build Once Deploy Many pattern)"
        default: ""
      deploy_by_digest:
        required: false
        type: boolean
        description: "If true, resolve env-SHA tag -> digest after pull and reuse that immutable ref for runner/remote container runs"
        default: false
      require_redis_readiness:
        required: false
        type: boolean
        description: "If true, require Redis-backed cache and channels readiness for backend mutation/deploy checks"
        default: false
      run_backend_lane:
        required: false
        type: boolean
        description: "If true, execute the backend swimlane for this deployment"
        default: true
      run_frontend_lane:
        required: false
        type: boolean
        description: "If true, execute the frontend swimlane for this deployment"
        default: true
      skip_tests_in_deploy:
        required: false
        type: boolean
        description: "If true, skip test-backend and test-frontend jobs (use when PR validation already ran tests)"
        default: false
    secrets:
      DO_ACCESS_TOKEN:
        required: true
        description: "DigitalOcean access token (shared across all environments)"
      SSH_HOST:
        required: false
        description: "SSH host for deployment (from job environment)"
      SSH_USER:
        required: false
        description: "SSH username for deployment (from job environment)"
      SSH_PASSWORD:
        required: false
        description: "SSH password for deployment (primary method - used by all deployments)"
      SSH_KEY:
        required: false
        description: "SSH private key (legacy/alternative - NOT CURRENTLY USED)"
      DB_HOST:
        required: false
        description: "Database host (for SSH tunnel, from job environment)"
      DB_PORT:
        required: false
        description: "Database port (defaults to 5432)"
      DB_NAME:
        required: false
        description: "Database name (from job environment)"
      DB_USER:
        required: false
        description: "Database user (from job environment)"
      DB_PASSWORD:
        required: false
        description: "Database password (from job environment)"
      DJANGO_SECRET_KEY:
        required: false
        description: "Django secret key (from job environment)"
      DJANGO_SETTINGS_MODULE:
        required: false
        description: "Django settings module path (from job environment)"
      REDIS_URL:
        required: false
        description: "Redis connection URL for non-dev backend readiness gate"
      VALKEY_URL:
        required: false
        description: "Valkey connection URL for non-dev backend readiness gate"
      ALLOWED_HOSTS:
        required: false
        description: "Django allowed hosts (from job environment)"
      DEBUG:
        required: false
        description: "Django debug mode (from job environment)"
      REACT_APP_API_BASE_URL:
        required: false
        description: "API base URL for frontend runtime config (from job environment)"
      BACKEND_HOST:
        required: false
        description: "Backend host IP/hostname for nginx proxy and Docker networking (from job environment)"
      DJANGO_SUPERUSER_USERNAME:
        required: false
        description: "Django superuser username (from job environment)"
      DJANGO_SUPERUSER_PASSWORD:
        required: false
        description: "Django superuser password (from job environment)"
      DJANGO_SUPERUSER_EMAIL:
        required: false
        description: "Django superuser email (from job environment)"
      DOMAIN_NAME:
        required: false
        description: "Domain name for SSL certificates (e.g., dev.meatscentral.com)"
      EMAIL_HOST_PASSWORD:
        required: false
        description: "SendGrid SMTP API key (from job environment - dev/uat/prod buckets)"
      SENTRY_DSN:
        required: false
        description: "Sentry DSN for error tracking (from job environment)"
      SENTRY_ENABLED:
        required: false
        description: "Enable/disable Sentry error tracking (from job environment)"
      SENTRY_AUTH_TOKEN:
        required: false
        description: "Sentry auth token for Sentry API access (AI assistant tooling)"
      SENTRY_ORG_SLUG:
        required: false
        description: "Sentry organization slug (AI assistant tooling)"
      SENTRY_BASE_URL:
        required: false
        description: "Sentry base URL (optional; self-hosted Sentry)"
      OPENAI_API_KEY:
        required: false
        description: "OpenAI API key (optional; Phase 8 AI features)"
      OPENAI_ORG_ID:
        required: false
        description: "OpenAI org ID (optional; Phase 8 AI features)"
      OPENAI_MODEL:
        required: false
        description: "OpenAI model (optional; Phase 8 AI features)"
      MICROSOFT_CLIENT_ID:
        required: false
        description: "Microsoft Azure OAuth client ID (from job environment)"
      MICROSOFT_CLIENT_SECRET:
        required: false
        description: "Microsoft Azure OAuth client secret (from job environment)"
      MICROSOFT_TENANT_ID:
        required: false
        description: "Microsoft Azure tenant ID (optional; use 'common' for multi-tenant apps)"
      MICROSOFT_REDIRECT_URI:
        required: false
        description: "Microsoft OAuth redirect URI (must match Azure app registration)"
      OAUTH_ENCRYPTION_KEY:
        required: false
        description: "Fernet key for encrypting stored OAuth tokens"
      STRIPE_SETTLEMENT_WEBHOOK_SECRET:
        required: false
        description: "Stripe Treasury settlement webhook signing secret"

env:
  REGISTRY: registry.digitalocean.com/meatscentral
  FRONTEND_IMAGE: projectmeats-frontend
  BACKEND_IMAGE: projectmeats-backend
  GHCR_REGISTRY: ghcr.io/meats-central

jobs:
  check_infrastructure:
    name: "Check Infrastructure (Golden Drift Gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Cache pip (infra)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-infra-${{ hashFiles('.github/scripts/check_infrastructure.sh', '.github/scripts/validate-workflows.sh') }}
          restore-keys: |
            ${{ runner.os }}-pip-infra-

      - name: Run infrastructure checks
        run: bash .github/scripts/check_infrastructure.sh

  # ==========================================
  # BACKEND SWIMLANE
  # ==========================================
  
  build-backend:
    name: "Build & Push Backend Image"
    if: ${{ inputs.run_backend_lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check_infrastructure]
    outputs:
      image_tag_ref: ${{ steps.backend_image_refs.outputs.tag_ref }}
      image_digest_ref: ${{ steps.backend_image_refs.outputs.digest_ref }}
      ghcr_image_tag_ref: ${{ steps.backend_image_refs.outputs.ghcr_tag_ref }}
      ghcr_image_digest_ref: ${{ steps.backend_image_refs.outputs.ghcr_digest_ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Conditional disk cleanup
        uses: ./.github/actions/disk-cleanup
        with:
          threshold_percent: "80"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to DOCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_ACCESS_TOKEN }}
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: build_backend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:cache
            type=gha,scope=backend-${{ inputs.environment }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:cache,mode=max
            type=gha,scope=backend-${{ inputs.environment }},mode=max

      - name: Export backend image refs
        id: backend_image_refs
        run: |
          TAG_REF="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}"
          GHCR_TAG_REF="${{ env.GHCR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}"
          DIGEST="${{ steps.build_backend.outputs.digest }}"

          {
            echo "tag_ref=$TAG_REF"
            echo "digest_ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@$DIGEST"
            echo "ghcr_tag_ref=$GHCR_TAG_REF"
            echo "ghcr_digest_ref=${{ env.GHCR_REGISTRY }}/${{ env.BACKEND_IMAGE }}@$DIGEST"
          } >> "$GITHUB_OUTPUT"

  security-scan-backend:
    name: "Security Scan: Backend"
    if: ${{ inputs.run_backend_lane && !inputs.skip_tests_in_deploy }}
    needs: [build-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Cache Trivy DB
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-cache-57a97c7e
          restore-keys: |
            ${{ runner.os }}-trivy-cache-

      # SARIF generation should not gate deployments.
      # Trivy's SARIF mode may include all severities, which can incorrectly fail the job
      # even when CRITICAL/HIGH are 0. We enforce severity thresholds in a separate step.
      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-backend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln'
          vuln-type: 'os,library'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ secrets.DO_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Enforce Trivy severity gate (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln'
          vuln-type: 'os,library'
          # Dev deploys should continue while we remediate findings; UAT/Prod remain blocking.
          exit-code: ${{ inputs.environment == 'development' && '0' || '1' }}
        env:
          TRIVY_USERNAME: ${{ secrets.DO_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Trivy summary (table)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln'
          vuln-type: 'os,library'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ secrets.DO_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Generate SBOM (CycloneDX)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          format: 'cyclonedx'
          output: 'sbom-backend.cdx.json'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ secrets.DO_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Upload SBOM (backend)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-backend-${{ inputs.environment }}-${{ github.sha }}
          path: sbom-backend.cdx.json
          if-no-files-found: ignore

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4
        with:
          sarif_file: 'trivy-results-backend.sarif'

  test-backend:
    name: "Test Backend"
    if: ${{ inputs.run_backend_lane && !inputs.skip_tests_in_deploy }}
    needs: [build-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Digest-pinned (multi-arch manifest) for deterministic CI
        image: pgvector/pgvector:pg15@sha256:7f5681e45237acdf546cf7cdc0dfc0ed7752ede857fda6e54f6ea21b936f8742
        env:
          POSTGRES_DB: projectmeats_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Free up runner disk space
        uses: ./.github/actions/disk-cleanup
        with:
          aggressive: "true"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectmeats_test
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          # Allow tests to import repo-root modules like `scripts.*` (matches pr-validation.yml)
          PYTHONPATH: ${{ github.workspace }}
          CI: '1'
        run: |
          python manage.py test --verbosity=2

  # ==========================================
  # FRONTEND SWIMLANE  
  # ==========================================
  
  build-frontend:
    name: "Build & Push Frontend Image"
    if: ${{ inputs.run_frontend_lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check_infrastructure]
    outputs:
      image_tag_ref: ${{ steps.frontend_image_refs.outputs.tag_ref }}
      image_digest_ref: ${{ steps.frontend_image_refs.outputs.digest_ref }}
      ghcr_image_tag_ref: ${{ steps.frontend_image_refs.outputs.ghcr_tag_ref }}
      ghcr_image_digest_ref: ${{ steps.frontend_image_refs.outputs.ghcr_digest_ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Conditional disk cleanup
        uses: ./.github/actions/disk-cleanup
        with:
          threshold_percent: "80"


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to DOCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_ACCESS_TOKEN }}
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        id: build_frontend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:cache
            type=gha,scope=frontend-${{ inputs.environment }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:cache,mode=max
            type=gha,scope=frontend-${{ inputs.environment }},mode=max

      - name: Export frontend image refs
        id: frontend_image_refs
        run: |
          TAG_REF="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}"
          GHCR_TAG_REF="${{ env.GHCR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}"
          DIGEST="${{ steps.build_frontend.outputs.digest }}"

          {
            echo "tag_ref=$TAG_REF"
            echo "digest_ref=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}@$DIGEST"
            echo "ghcr_tag_ref=$GHCR_TAG_REF"
            echo "ghcr_digest_ref=${{ env.GHCR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}@$DIGEST"
          } >> "$GITHUB_OUTPUT"

  security-scan-frontend:
    name: "Security Scan: Frontend (Selected Lane)"
    if: ${{ always() && !inputs.skip_tests_in_deploy }}
    needs: [build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Validate frontend scan lane
        run: |
          set -euo pipefail

          if [ "${{ inputs.run_frontend_lane }}" != "true" ]; then
            echo "Frontend lane not selected; skipping frontend security scan."
            exit 0
          fi

          if [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "✗ build-frontend result: ${{ needs.build-frontend.result }}" >&2
            exit 1
          fi

          echo "✓ Frontend scan prerequisites satisfied"

      - name: Cache Trivy DB
        if: ${{ inputs.run_frontend_lane }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-cache-57a97c7e
          restore-keys: |
            ${{ runner.os }}-trivy-cache-

      # SARIF generation should not gate deployments (see backend scan notes).
      - name: Run Trivy vulnerability scanner (SARIF)
        if: ${{ inputs.run_frontend_lane }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln'
          vuln-type: 'os,library'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ secrets.DO_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Enforce Trivy severity gate (CRITICAL,HIGH)
        if: ${{ inputs.run_frontend_lane }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln'
          vuln-type: 'os,library'
          # Dev deploys should continue while we remediate findings; UAT/Prod remain blocking.
          exit-code: ${{ inputs.environment == 'development' && '0' || '1' }}
        env:
          TRIVY_USERNAME: ${{ secrets.DO_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Trivy summary (table)
        if: ${{ inputs.run_frontend_lane && always() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: 'vuln'
          vuln-type: 'os,library'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ secrets.DO_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Generate SBOM (CycloneDX)
        if: ${{ inputs.run_frontend_lane && always() }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}-${{ github.sha }}
          format: 'cyclonedx'
          output: 'sbom-frontend.cdx.json'
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ secrets.DO_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Upload SBOM (frontend)
        if: ${{ inputs.run_frontend_lane && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-frontend-${{ inputs.environment }}-${{ github.sha }}
          path: sbom-frontend.cdx.json
          if-no-files-found: ignore

      - name: Upload Trivy results to GitHub Security
        if: ${{ inputs.run_frontend_lane && always() }}
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4
        with:
          sarif_file: 'trivy-results-frontend.sarif'

  test-frontend:
    name: "Test Frontend (Selected Lane)"
    if: ${{ always() && !inputs.skip_tests_in_deploy }}
    needs: [build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate frontend test lane
        run: |
          set -euo pipefail

          if [ "${{ inputs.run_frontend_lane }}" != "true" ]; then
            echo "Frontend lane not selected; skipping frontend tests."
            exit 0
          fi

          if [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "✗ build-frontend result: ${{ needs.build-frontend.result }}" >&2
            exit 1
          fi

          echo "✓ Frontend test prerequisites satisfied"

      - name: Checkout code
        if: ${{ inputs.run_frontend_lane }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        if: ${{ inputs.run_frontend_lane }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: ${{ inputs.run_frontend_lane }}
        working-directory: ./frontend
        run: npm ci

      - name: Verify frontend standards
        if: ${{ inputs.run_frontend_lane }}
        working-directory: ./frontend
        run: npm run verify-standards

      - name: Run frontend unit tests
        if: ${{ inputs.run_frontend_lane }}
        working-directory: ./frontend
        env:
          CI: '1'
        run: |
          # Hard timeout to avoid Vitest cleanup hangs blocking deploy indefinitely.
          timeout 10m npm run test:ci

  # ==========================================
  # Pre-Deployment: Migration Sanity Check
  # ==========================================
  
  check-migrations:
    name: "Check Migration State"
    if: ${{ inputs.run_backend_lane }}
    needs: [build-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
      
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check for unapplied migrations
        working-directory: ./backend
        env:
          SECRET_KEY: "dummy-key-for-check-only"
          DB_ENGINE: "django.db.backends.postgresql"
          DB_NAME: "dummy"
          DB_USER: "dummy"
          DB_PASSWORD: "dummy"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DJANGO_SETTINGS_MODULE: "projectmeats.settings.development"
        run: |
          # Run makemigrations in check mode
          # This will fail if there are model changes without migrations
          # NOTE: DB connection not required - Django just needs valid settings
          echo "🔍 Checking for unapplied model changes..."
          python manage.py makemigrations --check --dry-run || {
            echo "❌ ERROR: Unapplied model changes detected!"
            echo "You must run 'python manage.py makemigrations' locally and commit the generated migration files."
            echo "This prevents 'Split State' deployments where models and migrations are out of sync."
            exit 1
          }
          
          echo "✅ No unapplied model changes detected"
          
          # Show migration plan for audit trail
          echo ""
          echo "📋 Current migration plan:"
          python manage.py showmigrations --plan || echo "⚠️ Could not generate plan (database required)"
          
          echo ""
          echo "✅ Migration sanity check passed"

  # ==========================================
  # Backend Deployment: Migrations
  # ==========================================
  
  migrate:
    name: "Run Database Migrations"
    # Gate schema changes on tests + security scans to avoid "DB advanced but deploy blocked" failures.
    if: ${{ always() }}
    needs: [build-backend, check-migrations, security-scan-backend, security-scan-frontend, test-frontend]
    runs-on: ubuntu-latest
    environment: ${{ inputs.backend_environment }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate migration lane
        run: |
          set -euo pipefail

          if [ "${{ inputs.run_backend_lane }}" != "true" ]; then
            echo "Backend lane not selected; skipping migrations."
            exit 0
          fi

          if [ "${{ needs.build-backend.result }}" != "success" ]; then
            echo "✗ build-backend result: ${{ needs.build-backend.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.check-migrations.result }}" != "success" ]; then
            echo "✗ check-migrations result: ${{ needs.check-migrations.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.security-scan-backend.result }}" != "success" ] && [ "${{ needs.security-scan-backend.result }}" != "skipped" ]; then
            echo "✗ security-scan-backend result: ${{ needs.security-scan-backend.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.security-scan-frontend.result }}" != "success" ] && [ "${{ needs.security-scan-frontend.result }}" != "skipped" ]; then
            echo "✗ security-scan-frontend result: ${{ needs.security-scan-frontend.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.test-frontend.result }}" != "success" ] && [ "${{ needs.test-frontend.result }}" != "skipped" ]; then
            echo "✗ test-frontend result: ${{ needs.test-frontend.result }}" >&2
            exit 1
          fi

          echo "✓ Migration prerequisites satisfied"

      - name: Checkout code
        if: ${{ inputs.run_backend_lane }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Fail fast if required backend secrets are missing
        if: ${{ inputs.run_backend_lane }}
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          REQUIRE_REDIS_READINESS: ${{ inputs.require_redis_readiness }}
        run: |
          set -euo pipefail
          bash .github/scripts/validate-environment.sh \
            --environment "${{ inputs.backend_environment }}" \
            --workflow reusable-deploy.yml

      - name: Free up runner disk space
        if: ${{ inputs.run_backend_lane }}
        uses: ./.github/actions/disk-cleanup
        with:
          aggressive: "true"
      
      - name: Login to GHCR
        if: ${{ inputs.run_backend_lane }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup SSH tunnel to database
        if: ${{ inputs.run_backend_lane }}
        uses: ./.github/actions/ssh-tunnel
        with:
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_password: ${{ secrets.SSH_PASSWORD }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT || '5432' }}
      
      - name: Test tunnel connectivity
        if: ${{ inputs.run_backend_lane }}
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          echo "================================"
          echo "Testing Tunnel Connectivity"
          echo "================================"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Connection attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            if timeout 10 bash -c "PGPASSWORD='$DB_PASSWORD' psql \
              -h 127.0.0.1 \
              -p 5433 \
              -U '$DB_USER' \
              -d '$DB_NAME' \
              -c 'SELECT version();'" 2>&1; then
              echo ""
              echo "✓ Database accessible through tunnel"
              exit 0
            fi
            
            echo "Connection failed, waiting before retry..."
            sleep 3
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo ""
          echo "✗ Failed to connect to database after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Pre-migration DB backup (UAT/Prod only)
        if: inputs.environment != 'development'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          set -euo pipefail

          echo "================================"
          echo "Pre-migration Backup (UAT/Prod)"
          echo "================================"

          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          ENVIRONMENT="${{ inputs.environment }}"
          SHA="${{ github.sha }}"
          RUN_ID="${{ github.run_id }}"

          BACKUP_DIR="/root/projectmeats/db_backups/${ENVIRONMENT}"
          BACKUP_FILE="pgdump_${ENVIRONMENT}_${TS}_${SHA}_${RUN_ID}.dump"
          REMOTE_PATH="${BACKUP_DIR}/${BACKUP_FILE}"

          # Retention policy: keep last N backups per environment
          KEEP_COUNT=7
          if [ "$ENVIRONMENT" = "production" ]; then
            KEEP_COUNT=14
          fi

          echo "Creating remote backup directory (permissions locked down)..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; umask 077; mkdir -p '$BACKUP_DIR'; chmod 700 '$BACKUP_DIR'"

          echo "Streaming pg_dump through SSH (no local artifact; encrypted-in-transit)..."
          export PGPASSWORD="$DB_PASSWORD"
          pg_dump \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-acl \
            -h 127.0.0.1 \
            -p 5433 \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            | sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "$SSH_USER@$SSH_HOST" \
                "set -euo pipefail; umask 077; cat > '$REMOTE_PATH'"

          echo "Verifying backup exists + has sane size..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; \
              test -s '$REMOTE_PATH'; \
              BYTES=\$(stat -c%s '$REMOTE_PATH'); \
              echo \"✓ Backup created: $REMOTE_PATH size=\$BYTES bytes\"; \
              if [ \"\$BYTES\" -lt 10240 ]; then echo '✗ Backup too small (<10KB) - refusing to migrate'; exit 1; fi"

          echo "Verifying backup archive readability with pg_restore --list..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cat '$REMOTE_PATH'" \
            | pg_restore --list >/dev/null
          echo "✓ Backup archive verified via pg_restore --list"

          echo "Enforcing backup retention..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; \
              ls -1t '$BACKUP_DIR'/pgdump_${ENVIRONMENT}_*.dump 2>/dev/null | tail -n +\$((KEEP_COUNT + 1)) | xargs -r rm -f; \
              echo \"✓ Retention enforced (kept last $KEEP_COUNT)\""

      - name: Resolve backend image reference
        id: resolve-migrate-image
        if: ${{ inputs.run_backend_lane }}
        env:
          BACKEND_TAG_REF: ${{ needs.build-backend.outputs.image_tag_ref }}
          BACKEND_DIGEST_REF: ${{ needs.build-backend.outputs.image_digest_ref }}
          DEPLOY_BY_DIGEST: ${{ inputs.deploy_by_digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="$BACKEND_TAG_REF"
          if [ "$DEPLOY_BY_DIGEST" = "true" ]; then
            if echo "$BACKEND_DIGEST_REF" | grep -q '@sha256:'; then
              echo "✓ Using backend digest ref"
              IMAGE_REF="$BACKEND_DIGEST_REF"
            else
              echo "✗ Deploy-by-digest enabled, but backend digest could not be resolved" >&2
              exit 1
            fi
          fi
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Pull backend image
        if: ${{ inputs.run_backend_lane }}
        id: pull-migrate-image
        uses: ./.github/actions/docker-pull-retry
        with:
          image_ref: ${{ steps.resolve-migrate-image.outputs.image_ref }}
          docr_registry: ${{ env.REGISTRY }}
          ghcr_registry: ${{ env.GHCR_REGISTRY }}

      - name: Run migrations via Docker with tunnel
        if: ${{ inputs.run_backend_lane }}
        env:
          BACKEND_RUN_REF: ${{ steps.pull-migrate-image.outputs.resolved_ref }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          REQUIRE_REDIS_READINESS: ${{ inputs.require_redis_readiness }}
        run: |
          echo "================================"
          echo "Running Django Migrations"
          echo "================================"
          
          DATABASE_URL="postgresql://$DB_USER:$DB_PASSWORD@127.0.0.1:5433/$DB_NAME"
          echo "BACKEND_RUN_REF=$BACKEND_RUN_REF" >> "$GITHUB_ENV"

          REDIS_GATE_ARGS=""
          if [ "$REQUIRE_REDIS_READINESS" = "true" ]; then
            REDIS_GATE_ARGS="--require-redis-readiness"
          fi
          
          echo ""
          echo "Checking backend infrastructure prerequisites..."
          docker run --rm \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DB_ENGINE="django.db.backends.postgresql" \
            -e REDIS_URL="$REDIS_URL" \
            -e VALKEY_URL="$VALKEY_URL" \
            -e REQUIRE_REDIS_READINESS="$REQUIRE_REDIS_READINESS" \
            "$BACKEND_RUN_REF" \
            python manage.py check_infrastructure $REDIS_GATE_ARGS
          
          echo ""
          echo "Running migrations..."
          
          docker run --rm \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DB_ENGINE="django.db.backends.postgresql" \
            -e REDIS_URL="$REDIS_URL" \
            -e VALKEY_URL="$VALKEY_URL" \
            -e REQUIRE_REDIS_READINESS="$REQUIRE_REDIS_READINESS" \
            "$BACKEND_RUN_REF" \
            python manage.py migrate --fake-initial --noinput
          
          echo ""
          echo "✓ Migrations completed successfully"

          echo ""
          echo "================================"
          echo "Collecting Static Files"
          echo "================================"

          docker run --rm \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DB_ENGINE="django.db.backends.postgresql" \
            -e REDIS_URL="$REDIS_URL" \
            -e VALKEY_URL="$VALKEY_URL" \
            -e REQUIRE_REDIS_READINESS="$REQUIRE_REDIS_READINESS" \
            "$BACKEND_RUN_REF" \
            python manage.py collectstatic --noinput --clear
          
      - name: Cleanup SSH tunnel
        if: always()
        run: |
          echo "Cleaning up SSH tunnel..."
          # Find and force-kill processes using port 5433
          TUNNEL_PIDS=$(lsof -ti:5433 2>/dev/null || true)
          if [ -n "$TUNNEL_PIDS" ]; then
            for pid in $TUNNEL_PIDS; do
              kill -9 "$pid" 2>/dev/null || true
            done
            echo "✓ Force-killed tunnel processes: $TUNNEL_PIDS"
          else
            echo "✓ No tunnel processes found"
          fi

  bootstrap-backend:
    name: "Bootstrap Backend Data"
    if: ${{ always() && inputs.run_backend_lane }}
    needs: [build-backend, deploy-backend]
    runs-on: ubuntu-latest
    environment: ${{ inputs.backend_environment }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate backend bootstrap lane
        run: |
          set -euo pipefail

          if [ "${{ needs.build-backend.result }}" != "success" ]; then
            echo "✗ build-backend result: ${{ needs.build-backend.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.deploy-backend.result }}" != "success" ]; then
            echo "✗ deploy-backend result: ${{ needs.deploy-backend.result }}" >&2
            exit 1
          fi

          echo "✓ Backend bootstrap prerequisites satisfied"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Fail fast if required backend secrets are missing
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          REQUIRE_REDIS_READINESS: ${{ inputs.require_redis_readiness }}
        run: |
          set -euo pipefail
          bash .github/scripts/validate-environment.sh \
            --environment "${{ inputs.backend_environment }}" \
            --workflow reusable-deploy.yml

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH tunnel to database
        uses: ./.github/actions/ssh-tunnel
        with:
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_password: ${{ secrets.SSH_PASSWORD }}
          db_host: ${{ secrets.DB_HOST }}
          db_port: ${{ secrets.DB_PORT || '5432' }}

      - name: Resolve backend image reference
        id: resolve-bootstrap-image
        env:
          BACKEND_TAG_REF: ${{ needs.build-backend.outputs.image_tag_ref }}
          BACKEND_DIGEST_REF: ${{ needs.build-backend.outputs.image_digest_ref }}
          DEPLOY_BY_DIGEST: ${{ inputs.deploy_by_digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="$BACKEND_TAG_REF"
          if [ "$DEPLOY_BY_DIGEST" = "true" ]; then
            if echo "$BACKEND_DIGEST_REF" | grep -q '@sha256:'; then
              echo "✓ Using backend digest ref"
              IMAGE_REF="$BACKEND_DIGEST_REF"
            else
              echo "✗ Deploy-by-digest enabled, but backend digest could not be resolved" >&2
              exit 1
            fi
          fi
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Pull backend image
        id: pull-bootstrap-image
        uses: ./.github/actions/docker-pull-retry
        with:
          image_ref: ${{ steps.resolve-bootstrap-image.outputs.image_ref }}
          docr_registry: ${{ env.REGISTRY }}
          ghcr_registry: ${{ env.GHCR_REGISTRY }}

      - name: Bootstrap backend system data
        env:
          BACKEND_RUN_REF: ${{ steps.pull-bootstrap-image.outputs.resolved_ref }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE }}
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          REQUIRE_REDIS_READINESS: ${{ inputs.require_redis_readiness }}
        run: |
          set -euo pipefail
          DATABASE_URL="postgresql://$DB_USER:$DB_PASSWORD@127.0.0.1:5433/$DB_NAME"

          docker run --rm \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DJANGO_SETTINGS_MODULE="$DJANGO_SETTINGS_MODULE" \
            -e SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DB_ENGINE="django.db.backends.postgresql" \
            -e DJANGO_SUPERUSER_USERNAME="$DJANGO_SUPERUSER_USERNAME" \
            -e DJANGO_SUPERUSER_PASSWORD="$DJANGO_SUPERUSER_PASSWORD" \
            -e DJANGO_SUPERUSER_EMAIL="$DJANGO_SUPERUSER_EMAIL" \
            -e REDIS_URL="$REDIS_URL" \
            -e VALKEY_URL="$VALKEY_URL" \
            -e REQUIRE_REDIS_READINESS="$REQUIRE_REDIS_READINESS" \
            "$BACKEND_RUN_REF" \
            /bin/sh -lc 'python manage.py setup_superuser && python manage.py seed_system_products'

      - name: Cleanup SSH tunnel
        if: always()
        run: |
          echo "Cleaning up SSH tunnel..."
          TUNNEL_PIDS=$(lsof -ti:5433 2>/dev/null || true)
          if [ -n "$TUNNEL_PIDS" ]; then
            for pid in $TUNNEL_PIDS; do
              kill -9 "$pid" 2>/dev/null || true
            done
            echo "✓ Force-killed tunnel processes: $TUNNEL_PIDS"
          else
            echo "✓ No tunnel processes found"
          fi

  deploy-backend:
    name: "Deploy Backend Container"
    if: ${{ always() && inputs.run_backend_lane }}
    needs: [build-backend, migrate, security-scan-backend]
    runs-on: ubuntu-latest
    environment: ${{ inputs.backend_environment }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate backend deploy lane
        run: |
          set -euo pipefail

          if [ "${{ needs.build-backend.result }}" != "success" ]; then
            echo "✗ build-backend result: ${{ needs.build-backend.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.migrate.result }}" != "success" ]; then
            echo "✗ migrate result: ${{ needs.migrate.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.security-scan-backend.result }}" != "success" ] && [ "${{ needs.security-scan-backend.result }}" != "skipped" ]; then
            echo "✗ security-scan-backend result: ${{ needs.security-scan-backend.result }}" >&2
            exit 1
          fi

          echo "✓ Backend deploy prerequisites satisfied"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Fail fast if required backend secrets are missing
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          REQUIRE_REDIS_READINESS: ${{ inputs.require_redis_readiness }}
        run: |
          set -euo pipefail
          bash .github/scripts/validate-environment.sh \
            --environment "${{ inputs.backend_environment }}" \
            --workflow reusable-deploy.yml

      - name: Create Backend .env File Locally
        run: |
          # backend.env contains secrets; lock down permissions on the runner and ensure it is cleaned up.
          umask 077
          cat <<'EOF' | sed 's/^          //' > backend.env
          # Django reads SECRET_KEY at runtime; keep DJANGO_SECRET_KEY for backward compatibility.
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_SETTINGS_MODULE=${{ secrets.DJANGO_SETTINGS_MODULE }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          DEBUG=${{ secrets.DEBUG }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT || '5432' }}
          DB_ENGINE=django.db.backends.postgresql
          REDIS_URL=${{ secrets.REDIS_URL }}
          VALKEY_URL=${{ secrets.VALKEY_URL }}
          REQUIRE_REDIS_READINESS=${{ inputs.require_redis_readiness }}
          EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL=no-reply@meatscentral.com
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_ENABLED=${{ secrets.SENTRY_ENABLED }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG_SLUG=${{ secrets.SENTRY_ORG_SLUG }}
          SENTRY_BASE_URL=${{ secrets.SENTRY_BASE_URL }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_ORG_ID=${{ secrets.OPENAI_ORG_ID }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
          MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET=${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID=${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_REDIRECT_URI=${{ secrets.MICROSOFT_REDIRECT_URI }}
          OAUTH_ENCRYPTION_KEY=${{ secrets.OAUTH_ENCRYPTION_KEY }}
          STRIPE_SETTLEMENT_WEBHOOK_SECRET=${{ secrets.STRIPE_SETTLEMENT_WEBHOOK_SECRET }}
          GIT_COMMIT_SHA=${{ github.sha }}
          EOF

          chmod 600 backend.env
          
          # Verify EMAIL_HOST_PASSWORD is set (show length only for security)
          if [ -n "${{ secrets.EMAIL_HOST_PASSWORD }}" ]; then
            echo "✓ EMAIL_HOST_PASSWORD is set"
          else
            echo "⚠️  WARNING: EMAIL_HOST_PASSWORD is NOT set in environment secrets"
          fi
          
          echo "✓ backend.env file created locally"
      
      - name: Transfer .env to Server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /root/projectmeats/backend"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null backend.env ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/projectmeats/backend/.env
          echo "✓ backend/.env transferred to server"

      - name: Cleanup generated secret files (runner)
        if: always()
        run: |
          # Ensure no secret material is left on disk if a prior step fails.
          rm -f backend.env || true
      
      - name: Deploy backend container
        env:
          BACKEND_TAG_REF: ${{ needs.build-backend.outputs.image_tag_ref }}
          BACKEND_DIGEST_REF: ${{ needs.build-backend.outputs.image_digest_ref }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          REQUIRE_REDIS_READINESS: ${{ inputs.require_redis_readiness }}
        run: |
          export DEPLOY_BY_DIGEST="${{ inputs.deploy_by_digest }}"
          export BACKEND_TAG_REF
          export BACKEND_DIGEST_REF
          export REQUIRE_REDIS_READINESS

          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=10 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "DEPLOY_BY_DIGEST='${DEPLOY_BY_DIGEST}' \
             BACKEND_TAG_REF='${BACKEND_TAG_REF}' \
             BACKEND_DIGEST_REF='${BACKEND_DIGEST_REF}' \
             REQUIRE_REDIS_READINESS='${REQUIRE_REDIS_READINESS}' \
             bash -s" << 'SSH'
          set -euo pipefail
          
          REG="${{ env.GHCR_REGISTRY }}"
          IMG="${{ env.BACKEND_IMAGE }}"
          TAG="${{ inputs.environment }}-${{ github.sha }}"
          
          # Navigate to project directory
          cd /root/projectmeats || {
            echo "✗ Project directory not found at /root/projectmeats"
            exit 1
          }
          echo "✓ In directory: $(pwd)"
          echo "✓ backend/.env file already transferred"
          
          # Preemptively create and fix permissions for staticfiles and media directories on host
          echo "Creating and fixing permissions for staticfiles directory..."
          mkdir -p /root/projectmeats/staticfiles
          chown -R 1000:1000 /root/projectmeats/staticfiles
          chmod -R 775 /root/projectmeats/staticfiles
          echo "✓ staticfiles permissions fixed"

          echo "Creating and fixing permissions for media directory..."
          mkdir -p /root/projectmeats/media
          chown -R 1000:1000 /root/projectmeats/media
          chmod -R 775 /root/projectmeats/media
          echo "✓ media permissions fixed"
          
          # Login to registry using the workflow token so env-scoped DOCR overrides cannot break deploys.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          
          # Check disk space and cleanup if needed
          echo "Checking disk space..."
          df -h /
          USAGE=$(df / | awk 'NR==2{print $5}' | tr -d '%')
          echo "Current disk usage: ${USAGE}%"
          
          if [ "$USAGE" -gt 70 ]; then
            echo "⚠️  Disk usage above 70%, running quick Docker cleanup..."
            # Quick cleanup: only remove stopped containers and dangling images
            docker container prune -f || true
            # Remove dangling images only (not old tagged images which are slower)
            docker image prune -f || true
            echo "✓ Quick cleanup complete"
            df -h /
          fi
          
          # Pull new image (retry for transient DOCR auth timeouts)
          pull_with_retry() {
            local image="$1"
            local attempt=1
            local max_attempts=5
            local delay=5

            while [ $attempt -le $max_attempts ]; do
              echo "docker pull attempt ${attempt}/${max_attempts}: ${image}"
              if docker pull "$image"; then
                return 0
              fi

              if [ $attempt -lt $max_attempts ]; then
                echo "Pull failed; retrying in ${delay}s..."
                sleep "$delay"
                delay=$((delay * 2))
              fi

              attempt=$((attempt + 1))
            done

            echo "✗ docker pull failed after ${max_attempts} attempts"
            return 1
          }

          to_ghcr_ref() {
            printf '%s' "$1" | sed "s#^${{ env.REGISTRY }}#${{ env.GHCR_REGISTRY }}#"
          }

          TAG_REF="${BACKEND_TAG_REF:-${{ env.REGISTRY }}/$IMG:$TAG}"
          RUN_REF="$TAG_REF"
          RUN_REF="$(to_ghcr_ref "$RUN_REF")"
          HEALTH_PATH="/api/v1/health/"
          if [ "${REQUIRE_REDIS_READINESS:-false}" = "true" ]; then
            HEALTH_PATH="/api/v1/ready/"
          fi
          if [ "$DEPLOY_BY_DIGEST" = "true" ]; then
            BACKEND_GHCR_DIGEST_REF="$(to_ghcr_ref "${BACKEND_DIGEST_REF}")"
            if echo "${BACKEND_GHCR_DIGEST_REF}" | grep -q '@sha256:'; then
              echo "✓ Using backend build digest ref: ${BACKEND_GHCR_DIGEST_REF}"
              RUN_REF="${BACKEND_DIGEST_REF}"
              RUN_REF="$(to_ghcr_ref "$RUN_REF")"
            else
              echo "✗ Deploy-by-digest enabled, but build-backend did not export a digest ref"
              exit 1
            fi
          fi

          pull_with_retry "$RUN_REF"

          # Atomic deploy + rollback (single host): canary on alternate port, then swap.
          CAND_NAME="pm-backend-candidate"
          CAND_PORT="18000"
          PREV_NAME="pm-backend-prev"

          rollback() {
            echo "↩ Rolling back backend to previous container (best-effort)..."
            docker logs pm-backend --tail 100 2>/dev/null || true
            docker rm -f pm-backend 2>/dev/null || true

            if docker inspect "$PREV_NAME" >/dev/null 2>&1; then
              docker start "$PREV_NAME" >/dev/null 2>&1 || true
              docker rename "$PREV_NAME" pm-backend >/dev/null 2>&1 || true
              curl -L -s -o /dev/null -w "rollback_http=%{http_code}\n" "http://127.0.0.1:8000${HEALTH_PATH}" || true
              echo "✓ Rollback attempted"
            else
              echo "⚠ No previous container found ($PREV_NAME)"
            fi
          }

          # Cleanup stale canary/prev
          docker rm -f "$CAND_NAME" 2>/dev/null || true
          docker stop "$PREV_NAME" 2>/dev/null || true
          docker rm -f "$PREV_NAME" 2>/dev/null || true

          # Find existing container (supports legacy name)
          OLD_NAME=""
          for n in pm-backend projectmeats-backend; do
            if docker inspect "$n" >/dev/null 2>&1; then
              OLD_NAME="$n"
              break
            fi
          done

          echo "Starting backend canary on 127.0.0.1:${CAND_PORT}..."
          docker run -d --name "$CAND_NAME" \
            --restart unless-stopped \
            -p 127.0.0.1:${CAND_PORT}:8000 \
            --env-file /root/projectmeats/backend/.env \
            -e DB_HOST="${{ secrets.DB_HOST }}" \
            -e DB_NAME="${{ secrets.DB_NAME }}" \
            -e DB_USER="${{ secrets.DB_USER }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e DB_PORT="${{ secrets.DB_PORT || '5432' }}" \
            -e DJANGO_SUPERUSER_USERNAME="${{ secrets.DJANGO_SUPERUSER_USERNAME }}" \
            -e DJANGO_SUPERUSER_EMAIL="${{ secrets.DJANGO_SUPERUSER_EMAIL }}" \
            -e DJANGO_SUPERUSER_PASSWORD="${{ secrets.DJANGO_SUPERUSER_PASSWORD }}" \
            -v /root/projectmeats/media:/app/media \
            -v /root/projectmeats/staticfiles:/app/staticfiles \
            "$RUN_REF"

          echo "Waiting for canary to start..."
          MAX_WAIT=30
          ELAPSED=0
          until docker ps | grep -q "$CAND_NAME"; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "✗ Canary failed to start within ${MAX_WAIT}s"
              docker logs "$CAND_NAME" --tail 100 2>/dev/null || true
              docker rm -f "$CAND_NAME" 2>/dev/null || true
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          echo "Health-checking backend canary..."
          MAX_ATTEMPTS=25
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${CAND_PORT}${HEALTH_PATH}" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Canary health check passed (HTTP $HTTP_CODE)"
              break
            fi
            echo "Canary health attempt $ATTEMPT/$MAX_ATTEMPTS (HTTP $HTTP_CODE), retrying..."
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "✗ Canary health check failed; leaving existing backend untouched"
            docker logs "$CAND_NAME" --tail 200 2>/dev/null || true
            docker rm -f "$CAND_NAME" 2>/dev/null || true
            exit 1
          fi

          echo "Canary healthy. Swapping into canonical port 8000..."

          if [ -n "$OLD_NAME" ]; then
            docker stop "$OLD_NAME" 2>/dev/null || true
            docker rename "$OLD_NAME" "$PREV_NAME" 2>/dev/null || true
          fi

          docker rm -f pm-backend 2>/dev/null || true

          docker run -d --name pm-backend \
            --restart unless-stopped \
            -p 8000:8000 \
            --env-file /root/projectmeats/backend/.env \
            -e DB_HOST="${{ secrets.DB_HOST }}" \
            -e DB_NAME="${{ secrets.DB_NAME }}" \
            -e DB_USER="${{ secrets.DB_USER }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e DB_PORT="${{ secrets.DB_PORT || '5432' }}" \
            -e DJANGO_SUPERUSER_USERNAME="${{ secrets.DJANGO_SUPERUSER_USERNAME }}" \
            -e DJANGO_SUPERUSER_EMAIL="${{ secrets.DJANGO_SUPERUSER_EMAIL }}" \
            -e DJANGO_SUPERUSER_PASSWORD="${{ secrets.DJANGO_SUPERUSER_PASSWORD }}" \
            -v /root/projectmeats/media:/app/media \
            -v /root/projectmeats/staticfiles:/app/staticfiles \
            "$RUN_REF"

          echo "Waiting for canonical backend to start..."
          MAX_WAIT=30
          ELAPSED=0
          until docker ps | grep -q pm-backend; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "✗ Backend failed to start within ${MAX_WAIT}s"
              docker logs pm-backend --tail 100 2>/dev/null || true
              rollback
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          sleep 5

          # Health check with self-healing retry
          MAX_ATTEMPTS=20
          ATTEMPT=1
          RETRY_WITH_HEALING=false

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000${HEALTH_PATH}" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Backend health check passed (HTTP $HTTP_CODE)"
              break
            fi

            if [ $ATTEMPT -eq 10 ] && [ "$RETRY_WITH_HEALING" = "false" ]; then
              echo "⚠️  Health check failing - attempting self-healing..."
              docker exec pm-backend python manage.py clear_cache || echo "Cache clear failed (command may not exist)"
              sleep 10
              RETRY_WITH_HEALING=true
            fi

            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS (HTTP $HTTP_CODE), retrying..."
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "✗ Backend health check failed after $MAX_ATTEMPTS attempts"
            rollback
            exit 1
          fi

          echo "Cleaning up backend canary container..."
          docker rm -f "$CAND_NAME" 2>/dev/null || true

          echo ""
          echo "=== Integration diagnostics (non-secret) ==="
          docker exec pm-backend python -c "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=10)); summary=data.get('integration_summary',{}); warnings=data.get('integration_warnings',[]); print('integration_summary:'); print(json.dumps(summary, indent=2, sort_keys=True)); print(''); print('integration_warnings:' if warnings else 'No integration warnings.'); [print(f\"- {(w or {}).get('code')}: {(w or {}).get('message')}\") for w in warnings]"
          echo "=== End integration diagnostics ==="
          
          # Verify EMAIL_HOST_PASSWORD in container
          echo "Verifying EMAIL_HOST_PASSWORD in container..."
          if docker exec pm-backend printenv EMAIL_HOST_PASSWORD > /dev/null 2>&1; then
            EMAIL_LEN=$(docker exec pm-backend printenv EMAIL_HOST_PASSWORD | wc -c)
            echo "✓ EMAIL_HOST_PASSWORD is set in container ($EMAIL_LEN characters)"
          else
            echo "⚠️  WARNING: EMAIL_HOST_PASSWORD is NOT set in container"
            echo "Checking .env file on server..."
            grep EMAIL_HOST_PASSWORD /root/projectmeats/backend/.env || echo "Not found in .env file"
          fi
          SSH

  # ==========================================
  # Frontend Deployment Track
  # ==========================================
  
  deploy-frontend:
    name: "Deploy Frontend Container"
    # Frontend deploy must wait for migrations (but must NOT depend on deploy-backend).
    if: ${{ always() && inputs.run_frontend_lane }}
    needs: [build-frontend, migrate, security-scan-frontend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.frontend_environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate frontend deploy lane
        run: |
          set -euo pipefail

          if [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "✗ build-frontend result: ${{ needs.build-frontend.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.migrate.result }}" != "success" ]; then
            echo "✗ migrate result: ${{ needs.migrate.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.security-scan-frontend.result }}" != "success" ] && [ "${{ needs.security-scan-frontend.result }}" != "skipped" ]; then
            echo "✗ security-scan-frontend result: ${{ needs.security-scan-frontend.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.test-frontend.result }}" != "success" ] && [ "${{ needs.test-frontend.result }}" != "skipped" ]; then
            echo "✗ test-frontend result: ${{ needs.test-frontend.result }}" >&2
            exit 1
          fi

          echo "✓ Frontend deploy prerequisites satisfied"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Fail fast if required frontend secrets are missing
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -euo pipefail
          bash .github/scripts/validate-environment.sh \
            --environment "${{ inputs.frontend_environment }}" \
            --workflow reusable-deploy.yml

      - name: Setup SSH
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          # Install sshpass for password-based SSH (same as backend)
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -yqq sshpass
          fi

          # Fail fast on SSH connectivity issues instead of hanging on ssh-keyscan.
          timeout 30 sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo '✓ SSH preflight ok'"

      - name: Transfer nginx template to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /root/projectmeats/deploy/nginx"
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deploy/nginx/site.conf.template \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/projectmeats/deploy/nginx/site.conf.template

      - name: Deploy frontend container
        env:
          FRONTEND_TAG_REF: ${{ needs.build-frontend.outputs.image_tag_ref }}
          FRONTEND_DIGEST_REF: ${{ needs.build-frontend.outputs.image_digest_ref }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'SSH'
          set -euo pipefail

          BACKEND_HOST="${{ secrets.BACKEND_HOST }}"
          API_BASE_URL="${{ secrets.REACT_APP_API_BASE_URL }}"
          SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
          SENTRY_ENABLED="${{ secrets.SENTRY_ENABLED }}"
          ENVIRONMENT="${{ inputs.environment }}"
          IMAGE_TAG="${{ inputs.environment }}-${{ github.sha }}"
          REG="${{ env.GHCR_REGISTRY }}"
          IMG="${{ env.FRONTEND_IMAGE }}"
          DOMAIN_NAME="${{ secrets.DOMAIN_NAME }}"
          DEPLOY_BY_DIGEST="${{ inputs.deploy_by_digest }}"
          RUN_BACKEND_LANE="${{ inputs.run_backend_lane }}"
          FRONTEND_TAG_REF="${{ needs.build-frontend.outputs.image_tag_ref }}"
          FRONTEND_DIGEST_REF="${{ needs.build-frontend.outputs.image_digest_ref }}"

          # Use the same heredoc-based secret delivery as the backend deploy job.
          # Inline SSH env assignment can corrupt registry tokens that contain shell-significant characters.
          echo "==================================="
          echo "Frontend Deployment Debug Info"
          echo "==================================="
          echo "Registry: $REG"
          echo "Image: $IMG"
          echo "Tag: $IMAGE_TAG"
          echo "Full Image: $REG/$IMG:$IMAGE_TAG"
          echo "Environment: $ENVIRONMENT"
          echo "Backend Host: $BACKEND_HOST"
          echo "==================================="
          
          echo "==================================="
          echo "Remote Deployment Started"
          echo "==================================="
          echo "Image: $REG/$IMG:$IMAGE_TAG"
          
          # Create runtime config
          mkdir -p /opt/pm/frontend/env
          cat > /opt/pm/frontend/env/env-config.js << ENVJS
          window.ENV = {
            API_BASE_URL: "${API_BASE_URL}",
            ENVIRONMENT: "${ENVIRONMENT}",
            SENTRY_DSN: "${SENTRY_DSN:-}",
            SENTRY_ENABLED: "${SENTRY_ENABLED:-false}"
          };
          ENVJS
          
          echo "✓ Runtime config created"
          
          # Login to registry using the workflow token so env-scoped DOCR overrides cannot break deploys.
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "✓ Docker login successful"
          
          # Check disk space and cleanup if needed
          echo "Checking disk space..."
          df -h /
          USAGE=$(df / | awk 'NR==2{print $5}' | tr -d '%')
          echo "Current disk usage: ${USAGE}%"
          
          if [ "$USAGE" -gt 70 ]; then
            echo "⚠️  Disk usage above 70%, running Docker cleanup..."
            # Remove old/unused images (keep current deployment images)
            docker image prune -af --filter "until=24h" || true
            # Remove unused volumes
            docker volume prune -f || true
            # Remove build cache
            docker builder prune -af || true
            # Show disk after cleanup
            echo "Disk after cleanup:"
            df -h /
          fi
          
          # Pull new image (retry for transient DOCR auth timeouts)
          pull_with_retry() {
            local image="$1"
            local attempt=1
            local max_attempts=5
            local delay=5

            while [ $attempt -le $max_attempts ]; do
              echo "docker pull attempt ${attempt}/${max_attempts}: ${image}"
              if docker pull "$image"; then
                return 0
              fi

              if [ $attempt -lt $max_attempts ]; then
                echo "Pull failed; retrying in ${delay}s..."
                sleep "$delay"
                delay=$((delay * 2))
              fi

              attempt=$((attempt + 1))
            done

            echo "✗ docker pull failed after ${max_attempts} attempts"
            return 1
          }

          to_ghcr_ref() {
            printf '%s' "$1" | sed "s#^${{ env.REGISTRY }}#${{ env.GHCR_REGISTRY }}#"
          }

          TAG_REF="${FRONTEND_TAG_REF:-${{ env.REGISTRY }}/$IMG:$IMAGE_TAG}"
          RUN_REF="$TAG_REF"
          RUN_REF="$(to_ghcr_ref "$RUN_REF")"

          if [ "${DEPLOY_BY_DIGEST:-false}" = "true" ]; then
            FRONTEND_GHCR_DIGEST_REF="$(to_ghcr_ref "${FRONTEND_DIGEST_REF}")"
            if echo "${FRONTEND_GHCR_DIGEST_REF}" | grep -q '@sha256:'; then
              echo "✓ Using frontend build digest ref: ${FRONTEND_GHCR_DIGEST_REF}"
              RUN_REF="${FRONTEND_DIGEST_REF}"
              RUN_REF="$(to_ghcr_ref "$RUN_REF")"
            else
              echo "✗ Deploy-by-digest enabled, but build-frontend did not export a digest ref"
              exit 1
            fi
          fi

          echo "Pulling image: $RUN_REF"
          pull_with_retry "$RUN_REF"
          echo "✓ Image pulled successfully"

          # Atomic deploy + rollback: canary on alternate port, then swap.
          CAND_NAME="pm-frontend-candidate"
          CAND_PORT="18080"
          PREV_NAME="pm-frontend-prev"

          rollback() {
            echo "↩ Rolling back frontend to previous container (best-effort)..."
            docker logs pm-frontend --tail 100 2>/dev/null || true
            docker rm -f pm-frontend 2>/dev/null || true

            if docker inspect "$PREV_NAME" >/dev/null 2>&1; then
              docker start "$PREV_NAME" >/dev/null 2>&1 || true
              docker rename "$PREV_NAME" pm-frontend >/dev/null 2>&1 || true
              curl -L -s -o /dev/null -w "rollback_http=%{http_code}\n" http://127.0.0.1:8080/ || true
              echo "✓ Rollback attempted"
            else
              echo "⚠ No previous frontend container found ($PREV_NAME)"
            fi
          }

          wait_for_http_200() {
            local url="$1"
            local label="$2"
            local max_attempts="$3"
            local delay_seconds="$4"
            local attempt=1
            local http_code="000"

            while [ "$attempt" -le "$max_attempts" ]; do
              http_code=$(curl -L -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
              if [ "$http_code" = "200" ]; then
                LAST_HTTP_CODE="$http_code"
                echo "✓ ${label} passed (HTTP $http_code)"
                return 0
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "${label} attempt ${attempt}/${max_attempts} (HTTP $http_code), retrying..."
                sleep "$delay_seconds"
              fi

              attempt=$((attempt + 1))
            done

            LAST_HTTP_CODE="$http_code"
            return 1
          }

          # Cleanup stale canary/prev
          docker rm -f "$CAND_NAME" 2>/dev/null || true
          docker stop "$PREV_NAME" 2>/dev/null || true
          docker rm -f "$PREV_NAME" 2>/dev/null || true

          # Find existing container (supports legacy name)
          OLD_NAME=""
          for n in pm-frontend projectmeats-frontend; do
            if docker inspect "$n" >/dev/null 2>&1; then
              OLD_NAME="$n"
              break
            fi
          done

          echo "Starting frontend canary on 127.0.0.1:${CAND_PORT}..."
          docker run -d --name "$CAND_NAME" \
            --restart unless-stopped \
            -p 127.0.0.1:${CAND_PORT}:80 \
            -e REACT_APP_API_BASE_URL="${API_BASE_URL}" \
            -e REACT_APP_SENTRY_DSN="${SENTRY_DSN:-}" \
            -e BACKEND_HOST="${BACKEND_HOST}" \
            -e DOMAIN_NAME="${DOMAIN_NAME}" \
            -e ENVIRONMENT="${ENVIRONMENT}" \
            -v /opt/pm/frontend/env/env-config.js:/usr/share/nginx/html/env-config.js:ro \
            "$RUN_REF"

          echo "Waiting for frontend canary to start..."
          MAX_WAIT=30
          ELAPSED=0
          until docker ps | grep -q "$CAND_NAME"; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "✗ Canary failed to start within ${MAX_WAIT}s"
              docker logs "$CAND_NAME" --tail 100 2>/dev/null || true
              docker rm -f "$CAND_NAME" 2>/dev/null || true
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          echo "Health-checking frontend canary..."
          if ! wait_for_http_200 "http://127.0.0.1:${CAND_PORT}/" "Canary health check" 10 4; then
            echo "✗ Canary health check failed; leaving existing frontend untouched (HTTP ${LAST_HTTP_CODE})"
            docker logs "$CAND_NAME" --tail 200 2>/dev/null || true
            docker rm -f "$CAND_NAME" 2>/dev/null || true
            exit 1
          fi

          echo "Canary healthy. Swapping into canonical port 8080..."

          if [ -n "$OLD_NAME" ]; then
            docker stop "$OLD_NAME" 2>/dev/null || true
            docker rename "$OLD_NAME" "$PREV_NAME" 2>/dev/null || true
          fi

          docker rm -f pm-frontend 2>/dev/null || true

          docker run -d --name pm-frontend \
            --restart unless-stopped \
            -p 127.0.0.1:8080:80 \
            -e REACT_APP_API_BASE_URL="${API_BASE_URL}" \
            -e REACT_APP_SENTRY_DSN="${SENTRY_DSN:-}" \
            -e BACKEND_HOST="${BACKEND_HOST}" \
            -e DOMAIN_NAME="${DOMAIN_NAME}" \
            -e ENVIRONMENT="${ENVIRONMENT}" \
            -v /opt/pm/frontend/env/env-config.js:/usr/share/nginx/html/env-config.js:ro \
            "$RUN_REF"

          echo "Waiting for canonical frontend to start..."
          MAX_WAIT=30
          ELAPSED=0
          until docker ps | grep -q pm-frontend; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "✗ Frontend failed to start within ${MAX_WAIT}s"
              docker logs pm-frontend --tail 100 2>/dev/null || true
              rollback
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          # Health check - container serves on port 8080
          echo "Checking frontend health on port 8080..."
          if ! wait_for_http_200 "http://127.0.0.1:8080/" "Frontend health check" 10 5; then
            echo "✗ Frontend health check failed after 10 attempts (HTTP ${LAST_HTTP_CODE})"
            rollback
            exit 1
          fi

          # Ensure host nginx routes /api/* to the backend host (${BACKEND_HOST}:8000).
          # Without this, external API calls can hang (e.g., /api/v1/health/), blocking login.
          echo "Syncing host nginx reverse-proxy config (backend upstream = ${BACKEND_HOST}:8000)..."
          NGINX_SITE="/etc/nginx/sites-available/projectmeats-${ENVIRONMENT}"
          # Use template from deploy/nginx/site.conf.template (DRY - single source)
          # envsubst reads environment variables (not shell variables), so export first.
          export DOMAIN_NAME BACKEND_HOST
          envsubst '${DOMAIN_NAME} ${BACKEND_HOST}' < /root/projectmeats/deploy/nginx/site.conf.template | sudo tee "$NGINX_SITE" >/dev/null

          # Ensure this site wins for ${DOMAIN_NAME} by disabling any other enabled config that
          # declares the same server_name, then enabling ours with a lexicographically-first link.
          sudo mkdir -p /var/www/certbot 2>/dev/null || true

          for f in /etc/nginx/sites-enabled/*; do
            [ -e "$f" ] || continue
            if sudo grep -q "server_name ${DOMAIN_NAME};" "$f" 2>/dev/null; then
              echo "Disabling existing nginx site for ${DOMAIN_NAME}: $f"
              sudo rm -f "$f"
            fi
          done

          sudo ln -sf "$NGINX_SITE" "/etc/nginx/sites-enabled/000-projectmeats-${ENVIRONMENT}"
          sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
          sudo nginx -t
          sudo systemctl reload nginx

          # Validate that the host proxy is active and API routing responds quickly.
          HEALTH_TXT=$(curl -k -sS -m 5 --resolve "${DOMAIN_NAME}:443:127.0.0.1" "https://${DOMAIN_NAME}/health" || true)
          if ! echo "$HEALTH_TXT" | grep -q "^healthy"; then
            echo "✗ Host nginx /health check failed (expected 'healthy')"
            echo "Got: $HEALTH_TXT"
            exit 1
          fi

          # API routing check: hard-gate when backend was deployed in this run,
          # advisory-only when frontend-only (backend may legitimately be down).
          API_MAX_ATTEMPTS=8
          API_ATTEMPT=1
          API_CODE="000"

          # Reduce retries for frontend-only deploys — backend state is unknown
          if [ "$RUN_BACKEND_LANE" != "true" ]; then
            API_MAX_ATTEMPTS=2
            echo "⚠ Backend lane was not run — API routing check is advisory only"
          fi

          while [ $API_ATTEMPT -le $API_MAX_ATTEMPTS ]; do
            API_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" -m 10 --resolve "${DOMAIN_NAME}:443:127.0.0.1" "https://${DOMAIN_NAME}/api/v1/health/" || echo "000")

            if [ "$API_CODE" = "200" ] || [ "$API_CODE" = "503" ]; then
              break
            fi

            echo "API routing check attempt $API_ATTEMPT/$API_MAX_ATTEMPTS (HTTP $API_CODE), retrying..."
            sleep 20
            API_ATTEMPT=$((API_ATTEMPT + 1))
          done

          if [ "$API_CODE" != "200" ] && [ "$API_CODE" != "503" ]; then
            if [ "$RUN_BACKEND_LANE" = "true" ]; then
              echo "✗ Host nginx /api/v1/health/ unexpected HTTP ${API_CODE} (expected 200/503)"
              exit 1
            else
              echo "⚠ Host nginx /api/v1/health/ returned HTTP ${API_CODE} (advisory — backend lane was not deployed)"
            fi
          fi

          echo "✓ Host nginx config synced and verified (api_http=${API_CODE})"

          echo "Cleaning up frontend canary container..."
          docker rm -f "$CAND_NAME" 2>/dev/null || true
          
          echo ""
          echo "==================================="
          echo "✓ Frontend Deployment Complete"
          echo "==================================="
          echo "Container: pm-frontend"
          echo "Port: 127.0.0.1:8080 → 80"
          echo "External access: https://${DOMAIN_NAME}"
          echo "Note: Host nginx proxies external traffic to this container"
          SSH

  smoke-ready:
    name: "Smoke Ready"
    if: ${{ always() }}
    needs: [deploy-frontend, bootstrap-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate selected lanes before smoke
        run: |
          set -euo pipefail

          if [ "${{ inputs.run_frontend_lane }}" = "true" ] && [ "${{ needs.deploy-frontend.result }}" != "success" ]; then
            echo "✗ deploy-frontend result: ${{ needs.deploy-frontend.result }}" >&2
            exit 1
          fi

          if [ "${{ inputs.run_backend_lane }}" = "true" ] && [ "${{ needs.bootstrap-backend.result }}" != "success" ]; then
            echo "✗ bootstrap-backend result: ${{ needs.bootstrap-backend.result }}" >&2
            exit 1
          fi

          echo "✓ Selected lanes are ready for smoke validation"

  # ==========================================
  # Post-deploy smoke gates (Golden-compliant)
  # ==========================================

  post-deploy-smoke:
    name: "Post-Deploy Smoke Gates"
    needs: [smoke-ready]
    uses: ./.github/workflows/reusable-postdeploy-smoke.yml
    secrets: inherit
    with:
      backend_environment: ${{ inputs.backend_environment }}
      frontend_environment: ${{ inputs.frontend_environment }}
      require_redis_readiness: ${{ inputs.require_redis_readiness }}
      run_backend_lane: ${{ inputs.run_backend_lane }}
      run_frontend_lane: ${{ inputs.run_frontend_lane }}
