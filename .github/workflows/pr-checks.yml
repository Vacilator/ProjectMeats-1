name: PR Checks

# Clean, concise run name with emoji
run-name: "🔍 PR Check: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches: [development, uat, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # Detect Breaking Changes & Critical Changes
  # ============================================================================
  
  detect-changes:
    name: "Detect Critical Changes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comparison

      - name: Check for workflow changes
        id: workflow-changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^.github/workflows/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "⚠️  Workflow files changed - extra validation required" >> $GITHUB_STEP_SUMMARY
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for settings changes
        id: settings-changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "backend/projectmeats/settings/"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "⚠️  Django settings changed - INSTALLED_APPS validation required" >> $GITHUB_STEP_SUMMARY
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate workflow changes
        if: steps.workflow-changes.outputs.changed == 'true'
        run: |
          echo "## Workflow Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Critical Rules:**" >> $GITHUB_STEP_SUMMARY
          echo "1. ❌ No \`environment:\` on jobs using \`uses:\`" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Use \`secrets: inherit\` for reusable workflows" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Set \`environment:\` on jobs INSIDE reusable workflows" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Match secret names to \`config/env.manifest.json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Validation:** Run \`actionlint\` locally before merging" >> $GITHUB_STEP_SUMMARY

      - name: Validate settings changes
        if: steps.settings-changes.outputs.changed == 'true'
        run: |
          echo "## Django Settings Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Critical Rules:**" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ All INSTALLED_APPS must exist in codebase" >> $GITHUB_STEP_SUMMARY
          echo "2. ❌ No archived apps in INSTALLED_APPS" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ URL patterns match installed apps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Validation:** Run \`python manage.py check\` locally" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Architectural Review
  # ============================================================================
  
  architectural-review:
    name: "Architectural Review"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for django-tenants actual usage (not docs)
        run: |
          echo "Checking for django-tenants USAGE (excluding documentation)..."
          
          # Check Python code for actual django-tenants imports or usage
          # Exclude: .md files, comments, test files, archived code
          FOUND=0
          
          # Check for imports
          if find backend/ -name "*.py" \
            -not -path "*/archived/*" \
            -not -path "*/__pycache__/*" \
            -not -path "*/htmlcov/*" \
            -exec grep -l "^import django_tenants\|^from django_tenants" {} \; 2>/dev/null | grep -v "archived"; then
            echo "❌ ERROR: Found django-tenants imports in Python code"
            FOUND=1
          fi
          
          # Check for actual usage in requirements.txt
          if grep -q "^django-tenants" backend/requirements.txt 2>/dev/null; then
            echo "❌ ERROR: Found django-tenants in requirements.txt"
            FOUND=1
          fi
          
          # Check for schema_context usage (actual function calls)
          if find backend/ -name "*.py" \
            -not -path "*/archived/*" \
            -not -path "*/__pycache__/*" \
            -not -path "*/tests/*" \
            -not -name "test_*.py" \
            -exec grep -l "schema_context(" {} \; 2>/dev/null | grep -v "archived"; then
            echo "❌ ERROR: Found schema_context() usage in Python code"
            FOUND=1
          fi
          
          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "ProjectMeats uses SHARED SCHEMA multi-tenancy with tenant_id ForeignKey"
            echo "Documentation references to django-tenants are OK (explaining what NOT to use)"
            echo "See docs/ARCHITECTURE.md for correct patterns"
            exit 1
          fi
          
          echo "✅ No django-tenants usage found (documentation references are OK)"

      - name: Check for hardcoded secrets
        run: |
          # Check for potential secret leaks (excluding test files and examples)
          if grep -r -E "(SECRET_KEY|PASSWORD|API_KEY|TOKEN|APIKEY)\s*=\s*['\"][a-zA-Z0-9]{20,}" backend/ frontend/ \
            --exclude-dir=node_modules \
            --exclude-dir=__pycache__ \
            --exclude-dir=archived \
            --exclude-dir=tests \
            --exclude="test_*.py" \
            --exclude="*_test.py" \
            --exclude="*.test.ts" \
            --exclude="*.test.tsx" 2>/dev/null; then
            echo "⚠️  WARNING: Possible hardcoded secrets detected"
            echo "Review the above matches and ensure they're test data, not actual secrets"
            # Don't fail, just warn (could be example values or test fixtures)
          else
            echo "✅ No obvious hardcoded secrets"
          fi

      - name: Summary
        run: |
          echo "## ✅ Architectural Review Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ No django-tenants usage (docs mentions are OK)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ No hardcoded secrets detected" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Code Quality Checks
  # ============================================================================
  
  lint-docs:
    name: "Lint Documentation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint '**/*.md' \
            --ignore 'node_modules/**' \
            --ignore 'archived/**' \
            --ignore 'docs/archived/**' \
            --disable MD013 MD033 MD041 \
            || echo "::warning::Markdown lint issues found (non-blocking)"
  
  validate-heredocs:
    name: "Validate Heredoc Syntax"
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Make validation script executable
        run: chmod +x .github/hooks/check-heredoc-syntax.sh
      
      - name: Run heredoc syntax validation
        run: .github/hooks/check-heredoc-syntax.sh
      
      - name: Summary
        if: success()
        run: |
          echo "## ✅ Heredoc Syntax Valid" >> $GITHUB_STEP_SUMMARY
          echo "All workflow files have proper heredoc syntax" >> $GITHUB_STEP_SUMMARY
  
  check-lockfile-sync:
    name: "Validate Lockfile Sync"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Check for lockfile sync
        working-directory: frontend
        run: |
          echo "🔍 Checking if package-lock.json is in sync..."
          
          # Generate lockfile without installing
          npm install --package-lock-only
          
          # Check if there are any changes
          if ! git diff --exit-code package-lock.json; then
            echo ""
            echo "❌ ERROR: package-lock.json is out of sync with package.json"
            echo ""
            echo "To fix: cd frontend && npm install && git add package-lock.json"
            exit 1
          fi
          
          echo "✅ package-lock.json is in sync"
      
      - name: Summary
        if: success()
        run: |
          echo "## ✅ Lockfile Sync Valid" >> $GITHUB_STEP_SUMMARY
          echo "Dependencies are properly locked" >> $GITHUB_STEP_SUMMARY
