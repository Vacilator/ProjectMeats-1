name: Auto Promote UAT → Main

run-name: "🔁 Promote uat → main"

on:
  workflow_run:
    workflows: ["🚀 Deploy: Dev/UAT/Prod (Frontend + Backend via Golden Pipeline)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'uat'
      }}
    uses: ./.github/workflows/reusable-auto-promote.yml
    secrets: inherit
    with:
      source_branch: uat
      target_branch: main
      source_sha: ${{ github.event.workflow_run.head_sha }}
      source_ref: ${{ format('refs/heads/{0}', github.event.workflow_run.head_branch) }}
      commit_message: ${{ github.event.workflow_run.head_commit.message }}
