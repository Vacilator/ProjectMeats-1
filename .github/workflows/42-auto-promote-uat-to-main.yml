name: Auto Promote UAT → Main

run-name: "🔁 Promote uat → main"

on:
  workflow_run:
    workflows: ["🚀 Deploy: Dev/UAT/Prod (Frontend + Backend via Golden Pipeline)"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  release-preview:
    name: Preview next semantic release
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'uat'
      }}
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      preview_only: true
      source_sha: ${{ github.event.workflow_run.head_sha }}
      source_ref: ${{ format('refs/heads/{0}', github.event.workflow_run.head_branch) }}

  create-pr:
    name: Create PR uat → main
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'uat'
      }}
    needs: [release-preview]
    runs-on: ubuntu-latest

    steps:
      - name: Create promotion PR (if missing)
        env:
          # Prefer PAT if configured, otherwise fall back to the workflow GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          existing=$(gh pr list --repo "$REPO" --base main --head uat --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "✅ Promotion PR already exists: #$existing"
            exit 0
          fi

          sha="${{ github.event.workflow_run.head_sha }}"
          msg="${{ github.event.workflow_run.head_commit.message }}"
          release_tag="${{ needs.release-preview.outputs.release_tag }}"
          release_summary=$(cat <<'EOF'
          ${{ needs.release-preview.outputs.release_summary }}
          EOF
          )

          title="🚀 Promote uat → main (${sha:0:7})"
          if [ -n "${msg}" ]; then
            title="🚀 Promote uat → main - ${msg}"
          fi

          body=$(cat <<EOF
          Automated promotion PR created after successful UAT deployment.

          - Source: uat
          - Target: main
          - Commit: $sha
          - Release preview: ${release_tag}

          Preview changelog:
          ${release_summary}

          This PR does not bypass any gates; please review + merge when ready.
          EOF
          )

          gh pr create \
            --repo "$REPO" \
            --base main \
            --head uat \
            --title "$title" \
            --body "$body"
