name: PR Validation

run-name: >-
  ${{
    format(
      '🔍 PR Check: {0} (PR#{1})',
      github.event.pull_request.title,
      github.event.pull_request.number
    )
  }}

on:
  pull_request:
    branches: [development, uat, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  infrastructure-check:
    name: Infrastructure Drift Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Verify golden pipeline invariants
        run: bash .github/scripts/check_infrastructure.sh

  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_projectmeats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Validate migrations
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
        run: bash .github/scripts/validate-migrations.sh

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [validate-migrations]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_projectmeats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
          # Allow workflow tests to import repo-root modules like `scripts.*`
          PYTHONPATH: ${{ github.workspace }}
        run: python manage.py test --verbosity=2

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Verify frontend standards
        working-directory: ./frontend
        run: npm run verify-standards

  mobile-checks:
    name: Mobile Lint/Test/Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps
        working-directory: ./mobile
        run: npm ci

      - name: Lint mobile
        working-directory: ./mobile
        run: npm run lint

      - name: Type check mobile
        working-directory: ./mobile
        run: npm run type-check

      - name: Mobile tests
        working-directory: ./mobile
        run: npm test

  validate-copilot-squad:
    name: Validate Copilot Squad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate squad structure
        run: bash scripts/validate_copilot_squad.sh
