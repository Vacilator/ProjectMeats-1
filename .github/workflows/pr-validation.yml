name: PR Validation

run-name: >-
  ${{
    format('🔍 {0}', github.event.pull_request.title)
  }}

on:
  pull_request:
    branches: [development, uat, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "BASE_SHA missing; defaulting to full run" >&2
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          CHANGED="$(git diff --name-only "$BASE_SHA"...HEAD)"

          BACKEND="false"
          FRONTEND="false"

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              backend/*|pyproject.toml)             BACKEND="true" ;;
              frontend/*)                           FRONTEND="true" ;;
              shared/*)                             BACKEND="true"; FRONTEND="true" ;;
              docs/*|*.md)                          ;; # docs-only, no test impact
              mobile/*)                             ;; # handled by mobile-checks inline detection
              *)                                    BACKEND="true"; FRONTEND="true" ;;
            esac
          done <<< "$CHANGED"

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "Change detection: backend=$BACKEND frontend=$FRONTEND"

  infrastructure-check:
    name: Infrastructure Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Cache pre-commit environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Verify golden pipeline invariants
        run: bash .github/scripts/check_infrastructure.sh

      - name: Install backend deps and pre-commit
        run: |
          python -m pip install --quiet --disable-pip-version-check --root-user-action=ignore pre-commit
          python -m pip install --quiet --disable-pip-version-check --root-user-action=ignore -r backend/requirements.txt

      - name: Run repo hygiene hooks for changed files
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "BASE_SHA missing (not a pull_request event?)" >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          pre-commit run --from-ref "$BASE_SHA" --to-ref HEAD --show-diff-on-failure --color always

      - name: Enforce MASTER_PLAN as canonical planning source
        run: python3 scripts/check_master_plan_references.py

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true

  automation-security:
    name: Automation Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          chmod +x actionlint

      - name: Lint GitHub workflows
        shell: bash
        run: |
          set -euo pipefail
          ./actionlint -color

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

  openapi-artifact:
    name: OpenAPI Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Digest-pinned (multi-arch manifest) for deterministic CI
        image: postgres:15@sha256:3e43515057e113ee741fca2f621f15300be34a6d4a8dfcf2e20651288c8272f3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_projectmeats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect contract-sensitive changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "BASE_SHA missing (not a pull_request event?)" >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"

          RUN_JOB="false"

          while IFS= read -r path; do
            [ -z "$path" ] && continue

            case "$path" in
              mobile/*|backend/*|manifests/openapi/*|scripts/check_openapi_backcompat.py|.github/workflows/pr-validation.yml|.github/workflows/evidence-rubric.yml)
                RUN_JOB="true"
                break
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "run_job=$RUN_JOB" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        working-directory: ./backend
        run: pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements.txt

      - name: Generate OpenAPI schema (artifact)
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
        run: python manage.py spectacular --format openapi-json --verbosity 0 > ../openapi-schema.json

      - name: OpenAPI back-compat check
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        run: python scripts/check_openapi_backcompat.py --baseline manifests/openapi/openapi-schema.baseline.json --candidate openapi-schema.json

      - name: Upload OpenAPI schema artifact
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-schema
          path: openapi-schema.json
          if-no-files-found: error
          retention-days: 7

      - name: Skip OpenAPI artifact for non-contract PRs
        if: ${{ steps.scope.outputs.run_job != 'true' }}
        run: echo "Skipping OpenAPI artifact; PR does not touch backend, mobile, or contract-governed files."

  validate-migrations:
    name: Validate Migrations
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes]

    services:
      postgres:
        # Digest-pinned (multi-arch manifest) for deterministic CI
        image: postgres:15@sha256:3e43515057e113ee741fca2f621f15300be34a6d4a8dfcf2e20651288c8272f3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_projectmeats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: ./backend
        run: pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements.txt

      - name: Validate migrations
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
        run: bash .github/scripts/validate-migrations.sh

  backend-tests:
    name: Backend Tests
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [detect-changes, validate-migrations, backend-smoke]

    services:
      postgres:
        # Digest-pinned (multi-arch manifest) for deterministic CI
        image: postgres:15@sha256:3e43515057e113ee741fca2f621f15300be34a6d4a8dfcf2e20651288c8272f3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_projectmeats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: ./backend
        run: pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
          # Allow workflow tests to import repo-root modules like `scripts.*`
          PYTHONPATH: ${{ github.workspace }}
        run: python manage.py test --verbosity=2

  backend-smoke:
    name: Backend Smoke Tests
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, validate-migrations]

    services:
      postgres:
        # Digest-pinned (multi-arch manifest) for deterministic CI
        image: postgres:15@sha256:3e43515057e113ee741fca2f621f15300be34a6d4a8dfcf2e20651288c8272f3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_projectmeats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: ./backend
        run: pip install --quiet --disable-pip-version-check --root-user-action=ignore -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
          # Allow workflow tests to import repo-root modules like `scripts.*`
          PYTHONPATH: ${{ github.workspace }}
        run: >
          python manage.py test --verbosity=2
          apps.core.tests.test_api_bootstrap_smoke
          apps.core.tests.test_health
          apps.tenants.test_current_tenant_failclosed

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: "Guardrail: no new runtime console.* in frontend/src"
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "BASE_SHA missing (not a pull_request event?)" >&2
            exit 1
          fi

          # Ensure the base commit exists locally for diff.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          # Fail if this PR adds new runtime console.* calls in frontend/src.
          # (Exclude tests and the canonical logger implementation.)
          if git diff --unified=0 "$BASE_SHA"...HEAD -- \
            'frontend/src/**/*.ts' \
            'frontend/src/**/*.tsx' \
            ':(exclude)frontend/src/**/*.test.*' \
            ':(exclude)frontend/src/**/*.spec.*' \
            ':(exclude)frontend/src/**/__tests__/**' \
            ':(exclude)frontend/src/utils/logger.ts' \
            | grep -nE '^\+[^+].*console\.(log|warn|error|debug)\b'; then
            echo "❌ New console.* calls detected. Use logger.* instead." >&2
            exit 1
          fi

          echo "✓ No new runtime console.* calls detected"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: "Guardrail: ban batched query hook in form engine"
        shell: bash
        run: |
          set -euo pipefail

          FORBIDDEN_HOOK="$(printf 'use%s' 'Queries')"
          if grep -R -n "$FORBIDDEN_HOOK" frontend/src/components/Shared/ frontend/src/features/system/; then
            echo "❌ The banned batched query hook is not allowed in form engine surfaces. Use the single-key fetch pattern instead." >&2
            exit 1
          fi

          echo "✓ No banned batched query hook usage found in form engine surfaces"

      - name: Verify frontend standards
        working-directory: ./frontend
        run: npm run verify-standards

  frontend-tests:
    name: Frontend Unit Tests
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npm run test:ci

  frontend-prod-smoke:
    name: Frontend Prod Smoke
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root E2E deps
        run: npm ci

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run production-preview entity form smoke
        working-directory: ./frontend
        env:
          CI: 'true'
          VITE_ENABLE_E2E_SMOKE: '1'
          PLAYWRIGHT_PREVIEW: '1'
          PLAYWRIGHT_CHROMIUM_ONLY: '1'
        run: >
          npx playwright test
          --config playwright.config.ts
          e2e/entity-form-surface-smoke.spec.ts
          --project=chromium
          --shard=${{ matrix.shard }}/3

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-prod-smoke-artifacts-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  mobile-checks:
    name: Mobile Lint/Test/Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [openapi-artifact]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect mobile-sensitive changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "BASE_SHA missing (not a pull_request event?)" >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"

          RUN_JOB="false"

          while IFS= read -r path; do
            [ -z "$path" ] && continue

            case "$path" in
              mobile/*|backend/*|manifests/openapi/*|scripts/check_openapi_backcompat.py|.github/workflows/pr-validation.yml|.github/workflows/evidence-rubric.yml)
                RUN_JOB="true"
                break
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "run_job=$RUN_JOB" >> "$GITHUB_OUTPUT"

      - name: Download OpenAPI schema artifact
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-schema
          path: mobile

      - name: Set up Node
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        working-directory: ./mobile
        run: npm ci

      - name: Lint mobile
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        working-directory: ./mobile
        run: npm run lint

      - name: Type check mobile
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        working-directory: ./mobile
        run: npm run type-check

      - name: Mobile tests
        if: ${{ steps.scope.outputs.run_job == 'true' }}
        working-directory: ./mobile
        run: npm test

      - name: Skip mobile checks for non-mobile PRs
        if: ${{ steps.scope.outputs.run_job != 'true' }}
        run: echo "Skipping mobile checks; PR does not touch mobile or contract-governed files."

  validate-copilot-squad:
    name: Validate Copilot Squad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate squad structure
        run: bash scripts/validate_copilot_squad.sh

  pr-evidence-report:
    name: PR Evidence Report
    if: ${{ always() }}
    needs:
      - detect-changes
      - infrastructure-check
      - dependency-review
      - automation-security
      - openapi-artifact
      - validate-migrations
      - backend-smoke
      - backend-tests
      - frontend-typecheck
      - frontend-tests
      - frontend-prod-smoke
      - mobile-checks
      - validate-copilot-squad
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/evidence-rubric.yml
    with:
      needs-json: ${{ toJSON(needs) }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.sha }}
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      workflow-name: PR Validation
      allow-pr-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
