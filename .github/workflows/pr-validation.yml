name: PR Validation

run-name: >-
  ${{
    format(
      '🔍 PR Check: {0} (PR#{1})',
      github.event.pull_request.title,
      github.event.pull_request.number
    )
  }}

on:
  pull_request:
    branches: [development, uat, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_projectmeats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Validate migrations
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
        run: bash .github/scripts/validate-migrations.sh

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [validate-migrations]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_projectmeats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: projectmeats.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_projectmeats
          # Allow workflow tests to import repo-root modules like `scripts.*`
          PYTHONPATH: ${{ github.workspace }}
        run: python manage.py test --verbosity=2

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npm run type-check
