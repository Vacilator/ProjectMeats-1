name: PR Validation

# Comprehensive PR validation combining:
# - PR content checks (architectural, docs, heredocs, lockfiles)
# - Workflow syntax validation (actionlint, shellcheck)
# 
# Consolidated from pr-checks.yml + validate-workflows.yml for efficiency

run-name: "${{ github.event_name == 'pull_request' && format('🔍 PR Validation: {0}', github.event.pull_request.title) || format('🔍 Workflow Validation: {0}', github.ref_name) }}"

on:
  pull_request:
    branches: [development, uat, main]
  # Removed push trigger - validation only needed for PRs
  # Workflows are already validated in PRs before merge

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel validation runs

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # Job 1: Detect Critical Changes
  # ============================================================================
  
  detect-changes:
    name: "Detect Critical Changes"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Only for PRs
    outputs:
      has_breaking_changes: ${{ steps.detect.outputs.has_breaking_changes }}
      has_workflow_changes: ${{ steps.detect.outputs.has_workflow_changes }}
      has_backend_changes: ${{ steps.detect.outputs.has_backend_changes }}
      has_frontend_changes: ${{ steps.detect.outputs.has_frontend_changes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comparison
      
      - name: Detect changes
        id: detect
        run: |
          # Get list of changed files
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Detect breaking changes
          if echo "$CHANGED_FILES" | grep -qE "(migrations/|models\.py|serializers\.py)"; then
            echo "has_breaking_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_breaking_changes=false" >> $GITHUB_OUTPUT
          fi
          
          # Detect workflow changes
          if echo "$CHANGED_FILES" | grep -q ".github/workflows/"; then
            echo "has_workflow_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_workflow_changes=false" >> $GITHUB_OUTPUT
          fi
          
          # Detect backend changes
          if echo "$CHANGED_FILES" | grep -q "backend/"; then
            echo "has_backend_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_backend_changes=false" >> $GITHUB_OUTPUT
          fi
          
          # Detect frontend changes
          if echo "$CHANGED_FILES" | grep -q "frontend/"; then
            echo "has_frontend_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_frontend_changes=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Job 2: Architectural Review
  # ============================================================================
  
  architectural-review:
    name: "Architectural Review"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Only for PRs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for django-tenants usage
        run: |
          echo "Checking for prohibited django-tenants usage..."
          
          # Only check actual code files, not documentation or comments
          # Grep output format: "filename:line_content"
          # Filter out lines where the content after ":" starts with # or - (comment markers)
          FOUND=$(grep -r "from django_tenants\|import django_tenants\|schema_context\|migrate_schemas" \
            --include="*.py" \
            --exclude-dir=archived \
            --exclude-dir=docs \
            backend/ | grep -v -E ":\s*#|:\s*-" || true)
          
          if [ -n "$FOUND" ]; then
            echo "❌ ERROR: Found django-tenants usage in code!"
            echo "$FOUND"
            echo ""
            echo "ProjectMeats uses SHARED SCHEMA multi-tenancy."
            echo "NEVER use django-tenants patterns."
            exit 1
          fi
          
          echo "✅ No django-tenants usage found in code"

  # ============================================================================
  # Job 3: Documentation Linting
  # ============================================================================
  
  lint-docs:
    name: "Lint Documentation"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Only for PRs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for broken links in docs
        continue-on-error: true  # Don't block PR on broken doc links (cleanup task for later)
        run: |
          echo "Checking for broken internal links..."
          
          # Check if any .md files reference non-existent files
          BROKEN=0
          find docs -name "*.md" -type f 2>/dev/null | while IFS= read -r file; do
            # Extract file references (simple check)
            grep -oE '\[.*\]\([^)]+\)' "$file" | grep -oE '\([^)]+\)' | sed 's/[()]//g' | while IFS= read -r link; do
              if [[ "$link" == /* ]] || [[ "$link" == ../* ]]; then
                if [ ! -f "$link" ] && [ ! -d "$link" ]; then
                  echo "❌ Broken link in $file: $link"
                  BROKEN=1
                fi
              fi
            done
          done
          
          if [ $BROKEN -eq 1 ]; then
            echo "⚠️  Found broken documentation links (non-blocking)"
            exit 0  # Don't fail the build
          fi
          
          echo "✅ No broken links found"

  # ============================================================================
  # Job 4: Validate Heredocs
  # ============================================================================
  
  validate-heredocs:
    name: "Validate Heredoc Syntax"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Only for PRs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check heredoc formatting
        run: |
          echo "Checking heredoc syntax in workflows..."
          
          INVALID=0
          for file in .github/workflows/*.yml; do
            # Check for unquoted heredocs with indented EOF
            if grep -n "<<[^']EOF" "$file" | grep -v "<<-"; then
              echo "❌ Invalid heredoc in $file"
              echo "Use <<- operator for indented content or quote delimiter: <<'EOF'"
              INVALID=1
            fi
          done
          
          if [ $INVALID -eq 1 ]; then
            exit 1
          fi
          
          echo "✅ All heredocs properly formatted"

  # ============================================================================
  # Job 5: Check Lockfile Sync
  # ============================================================================
  
  check-lockfile-sync:
    name: "Check Lockfile Sync"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Only for PRs
    needs: [detect-changes]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check frontend lockfile sync
        if: needs.detect-changes.outputs.has_frontend_changes == 'true'
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          HAS_PACKAGE_JSON=$(echo "$CHANGED_FILES" | grep -c "frontend/package.json" || true)
          HAS_PACKAGE_LOCK=$(echo "$CHANGED_FILES" | grep -c "frontend/package-lock.json" || true)
          
          if [ "$HAS_PACKAGE_JSON" -gt 0 ] && [ "$HAS_PACKAGE_LOCK" -eq 0 ]; then
            echo "❌ ERROR: package.json changed but package-lock.json did not!"
            echo "Run 'npm install' in frontend/ to update lockfile"
            exit 1
          fi
          
          echo "✅ Frontend lockfile in sync"
      
      - name: Check backend lockfile sync
        if: needs.detect-changes.outputs.has_backend_changes == 'true'
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          HAS_REQUIREMENTS=$(echo "$CHANGED_FILES" | grep -c "backend/requirements.txt" || true)
          # shellcheck disable=SC2034
          HAS_LOCK=$(echo "$CHANGED_FILES" | grep -c "backend/requirements.lock" || true)
          
          # Note: We don't enforce requirements.lock (not using it yet)
          # Just check if requirements.txt is properly formatted
          if [ "$HAS_REQUIREMENTS" -gt 0 ]; then
            echo "✅ Backend requirements changed"
          fi
          
          echo "✅ Backend requirements valid"

  # ============================================================================
  # Job 6: Validate Workflow Syntax (actionlint + shellcheck)
  # ============================================================================
  
  validate-workflow-syntax:
    name: "Validate Workflow YAML Syntax"
    runs-on: ubuntu-latest
    # Run on PR if workflows changed, OR on push to branches if workflows changed
    if: |
      (github.event_name == 'pull_request' && needs.detect-changes.outputs.has_workflow_changes == 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, '.github/workflows/'))
    needs: [detect-changes]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/
      
      - name: Validate workflow files
        run: |
          echo "Validating all workflow files..."
          # Use find to only validate non-archived workflows
          # Ignore info-level ShellCheck warnings that are too noisy:
          # - SC2009 (pgrep suggestion - often not applicable)
          # - SC2001 (parameter expansion - style preference)
          # - SC2086 (quoting - too many false positives in workflows)
          # - SC2069 (redirect order - style preference)
          find .github/workflows -maxdepth 1 -name '*.yml' -type f -exec actionlint -color -ignore 'shellcheck reported issue.*SC2009' -ignore 'shellcheck reported issue.*SC2001' -ignore 'shellcheck reported issue.*SC2086:info' -ignore 'shellcheck reported issue.*SC2069' {} +
      
      - name: Check for common mistakes
        run: |
          echo "Checking for common workflow mistakes..."
          
          # Check: environment: with uses: (INVALID)
          if grep -r "environment:" .github/workflows/*.yml | grep -A5 "uses:"; then
            echo "❌ ERROR: Found 'environment:' used with 'uses:' (invalid syntax)"
            echo "RULE: Jobs calling reusable workflows CANNOT have environment: set"
            echo "FIX: Remove environment: from caller, set it in reusable workflow jobs"
            exit 1
          fi
          
          # Check: Missing secrets declaration on reusable workflow call
          if grep -r "uses: \.\/\.github\/workflows\/" .github/workflows/main-pipeline.yml | grep -v "secrets:"; then
            echo "⚠️  WARNING: Reusable workflow call without secrets declaration"
            echo "Best practice: Explicitly pass secrets to reusable workflows"
          fi
          
          echo "✅ No common mistakes found"
      
      - name: Verify INSTALLED_APPS matches codebase
        run: |
          echo "Checking INSTALLED_APPS consistency..."
          
          # Extract INSTALLED_APPS from settings
          if [ -f "backend/apps/settings.py" ]; then
            INSTALLED=$(grep -A 50 "INSTALLED_APPS = \[" backend/apps/settings.py | grep "'apps\." | sed "s/.*'apps\.\([^']*\)'.*/\1/")
            
            # Check if corresponding directories exist
            for app in $INSTALLED; do
              if [ ! -d "backend/apps/$app" ]; then
                echo "⚠️  WARNING: INSTALLED_APPS references 'apps.$app' but directory doesn't exist"
              fi
            done
          fi
          
          echo "✅ INSTALLED_APPS check complete"
      
      - name: Summary
        if: always()
        run: |
          {
            echo "## 🔍 Workflow Validation Summary"
            echo ""
            echo "✅ actionlint validation: Passed"
            echo "✅ Common mistakes check: Passed"
            echo "✅ INSTALLED_APPS check: Passed"
          } >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 7: Final Summary
  # ============================================================================
  
  validation-summary:
    name: "Validation Summary"
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [detect-changes, architectural-review, lint-docs, validate-heredocs, check-lockfile-sync, validate-workflow-syntax]
    
    steps:
      - name: Generate summary
        run: |
          {
            echo "## 🔍 PR Validation Complete"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Detect Changes | ${{ needs.detect-changes.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| Architectural Review | ${{ needs.architectural-review.result == 'success' && '✅ Passed' || needs.architectural-review.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
            echo "| Documentation Lint | ${{ needs.lint-docs.result == 'success' && '✅ Passed' || needs.lint-docs.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
            echo "| Heredoc Validation | ${{ needs.validate-heredocs.result == 'success' && '✅ Passed' || needs.validate-heredocs.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
            echo "| Lockfile Sync | ${{ needs.check-lockfile-sync.result == 'success' && '✅ Passed' || needs.check-lockfile-sync.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
            echo "| Workflow Syntax | ${{ needs.validate-workflow-syntax.result == 'success' && '✅ Passed' || needs.validate-workflow-syntax.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |"
            echo ""
            echo "### Changed Components"
            echo "- Breaking changes: ${{ needs.detect-changes.outputs.has_breaking_changes }}"
            echo "- Workflow changes: ${{ needs.detect-changes.outputs.has_workflow_changes }}"
            echo "- Backend changes: ${{ needs.detect-changes.outputs.has_backend_changes }}"
            echo "- Frontend changes: ${{ needs.detect-changes.outputs.has_frontend_changes }}"
          } >> $GITHUB_STEP_SUMMARY
