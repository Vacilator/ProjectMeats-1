name: "Disk Cleanup"
description: "Free up runner disk space by removing unnecessary packages and Docker artifacts"

inputs:
  threshold_percent:
    description: "Trigger cleanup when disk usage exceeds this percentage"
    required: false
    default: "70"
  aggressive:
    description: "If true, removes large pre-installed packages (dotnet, Android, etc.)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Conditional disk cleanup
      shell: bash
      run: |
        set -euo pipefail

        THRESHOLD="${{ inputs.threshold_percent }}"
        AGGRESSIVE="${{ inputs.aggressive }}"

        USAGE=$(df / | awk 'NR==2{print $5}' | tr -d '%')
        echo "Current disk usage: ${USAGE}% (threshold: ${THRESHOLD}%)"

        if [ "$AGGRESSIVE" = "true" ]; then
          echo "Running aggressive cleanup..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          echo "✓ Aggressive cleanup complete"
          df -h /
        elif [ "$USAGE" -gt "$THRESHOLD" ]; then
          echo "Disk usage above ${THRESHOLD}%, running cleanup..."
          docker container prune -f 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          echo "✓ Cleanup complete"
          df -h /
        else
          echo "✓ Disk usage acceptable, no cleanup needed"
        fi
