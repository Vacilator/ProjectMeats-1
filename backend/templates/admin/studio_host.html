<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Blueprint Studio - {{ blueprint_id }}</title>
    
    <!-- Tailwind CSS CDN for immediate styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- React mount point with data attributes -->
    <div 
        id="root" 
        data-blueprint-id="{{ blueprint_id }}"
        class="h-screen w-screen bg-gray-50 text-gray-900"
    ></div>
    
    <!-- Load React app from main frontend build -->
    <script type="module" crossorigin src="/static/js/main.js"></script>
    <link rel="stylesheet" href="/static/css/main.css">
    
    <!-- Initialize Studio App -->
    <script type="module">
        // The main app will detect the studio context from the route
        // and render the Studio component instead of the full app
        console.log('Studio page loaded for blueprint:', document.getElementById('root').dataset.blueprintId);
    </script>
</body>
</html>
