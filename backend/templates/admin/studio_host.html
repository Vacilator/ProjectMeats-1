<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Blueprint Studio - {{ blueprint_id }}</title>
    
    <!-- Clean slate - NO Django admin styles -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
    </style>
    
    {% if debug %}
    <!-- Development mode: Vite dev server -->
    <script type="module">
        import RefreshRuntime from 'http://localhost:3000/@react-refresh'
        RefreshRuntime.injectIntoGlobalHook(window)
        window.$RefreshReg$ = () => {}
        window.$RefreshSig$ = () => (type) => type
        window.__vite_plugin_react_preamble_installed__ = true
    </script>
    <script type="module" src="http://localhost:3000/src/apps/admin-studio/main.tsx"></script>
    {% else %}
    <!-- Production mode: Static build -->
    {% load static %}
    <!-- Note: Asset filenames include content hashes. Update these after each build -->
    <!-- Or implement a manifest.json loader in production -->
    <link rel="stylesheet" href="{% static 'frontend/admin_studio.css' %}">
    <script type="module" src="{% static 'frontend/admin_studio.js' %}"></script>
    {% endif %}
</head>
<body>
    <!-- React mount point with data attributes -->
    <div 
        id="root" 
        data-blueprint-id="{{ blueprint_id }}"
        class="h-screen w-screen bg-background text-foreground"
    ></div>
</body>
</html>
