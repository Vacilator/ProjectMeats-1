[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gunicorn]
command=gunicorn projectmeats.wsgi:application --bind 0.0.0.0:8000 --workers %(ENV_GUNICORN_WORKERS)s --timeout %(ENV_GUNICORN_TIMEOUT)s --graceful-timeout 30 --max-requests %(ENV_GUNICORN_MAX_REQUESTS)s --max-requests-jitter 100 --access-logfile - --error-logfile - --log-level info --forwarded-allow-ips="*"
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:daphne]
command=daphne --bind 0.0.0.0 --port 8001 --http-timeout 120 --proxy-headers --access-log - --verbosity 1 projectmeats.asgi:application
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
