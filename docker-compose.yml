version: "3.9"

services:
  # PostgreSQL database - shared for multi-tenant architecture
  db:
    image: postgres:15
    container_name: projectmeats-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectmeats}
      POSTGRES_USER: ${POSTGRES_USER:-projectmeats}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectmeats} -d ${POSTGRES_DB:-projectmeats}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django backend API
  backend:
    image: registry.digitalocean.com/meatscentral/projectmeats-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-projectmeats}
      - DB_USER=${POSTGRES_USER:-projectmeats}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # React frontend
  frontend:
    image: registry.digitalocean.com/meatscentral/projectmeats-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pm-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  backend_media:
  backend_static:
