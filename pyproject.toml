[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "projectmeats3"
version = "1.0.0"
description = "Business management application for meat sales brokers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ProjectMeats Team"}
]
keywords = ["django", "react", "business", "meat-sales", "broker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
]

# No dependencies at the root level - this is a full-stack application
# Dependencies are managed separately for backend (requirements.txt) and frontend (package.json)
dependencies = []

[project.optional-dependencies]
backend = [
    "Django>=4.2.7",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.3.1",
    "django-environ>=0.11.2",
    "django-filter>=23.3",
    "psycopg[binary]>=3.2.9",
    "dj-database-url>=2.1.0",
    "drf-spectacular>=0.27.0",
    "python-decouple>=3.8",
    "Pillow>=10.2.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
]

dev = [
    "django-extensions>=3.2.3",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
]

production = [
    "gunicorn>=21.2.0",
    "whitenoise>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/Meats-Central/ProjectMeats3"
Repository = "https://github.com/Meats-Central/ProjectMeats3.git"
Issues = "https://github.com/Meats-Central/ProjectMeats3/issues"

[project.scripts]
projectmeats-setup = "setup_env:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["projectmeats3*"]
exclude = ["tests*", "frontend*", "backend*", "docs*", "config*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml"]

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "projectmeats.settings.development"
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["backend"]
norecursedirs = ["archived"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
    "--ignore=backend/archived",
    "--ignore=archived",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["backend/apps", "backend/projectmeats"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/admin.py",
    "*/conftest.py",
    "*_test.py",
    "test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if settings.DEBUG:",
]
show_missing = true
precision = 2
fail_under = 0

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Black Configuration
# ============================================================================

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
    | node_modules
)/
'''

# ============================================================================
# isort Configuration
# ============================================================================

[tool.isort]
profile = "black"
line_length = 120
known_django = ["django", "rest_framework"]
known_first_party = ["apps", "projectmeats"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = ["migrations", "node_modules", ".git", "__pycache__"]